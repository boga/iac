name: "Backup"

on:
  workflow_dispatch:
  push:

jobs:
  linter:
    name: "Restic backup"
    runs-on: [ubuntu-latest]
    steps:
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Debug
        run: |
          tailscale ssh ans@little "ls -la /mnt"