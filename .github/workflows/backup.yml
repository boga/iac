name: "Backup"

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "00 4 * * *"

jobs:
  backup:
    name: "backup"
    runs-on: [ubuntu-latest]
    defaults:
      run:
        working-directory: ./ansible

    steps:
      - name: Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Create Ansible Vault password file
        id: create-ansible-vault-password-file
        uses: ./.github/actions/create-file
        with:
          file-content: '${{ secrets.ANSIBLE_VAULT_PASSWORD }}'

      - name: Run Ansible Playbook
        run: ansible-playbook --vault-password-file=${{ steps.create-ansible-vault-password-file.outputs.file-path }} backup.yml
