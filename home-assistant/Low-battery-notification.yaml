alias: Low battery notification
id: low_battery_notification
description: Notify when a non-mobile device battery drops to 15% or lower.
mode: queued
max: 10
triggers:
  - trigger: event
    event_type: state_changed
conditions:
  - condition: template
    value_template: >
      {% set entity_id = trigger.event.data.entity_id %}
      {% set old_state = trigger.event.data.old_state %}
      {% set new_state = trigger.event.data.new_state %}
      {{ entity_id.startswith('sensor.')
         and old_state is not none
         and new_state is not none
         and new_state.attributes.get('device_class') == 'battery'
         and old_state.state | float(101) > 15
         and new_state.state | float(101) <= 15
         and config_entry_attr(config_entry_id(entity_id), 'domain') != 'mobile_app' }}
actions:
  - action: notify.tg_notifications
    data:
      title: Low battery
      message: >
        {{ trigger.event.data.new_state.name }} battery is at
        {{ trigger.event.data.new_state.state }}%.
