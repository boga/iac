[tools]
python = "3"

[env]
KUBECONFIG = "{{config_root}}/talos/kubeconfig"
_.python.venv = { path = ".venv" }

[tasks.talos-kubeconfig]
description = "Write Talos kubeconfig from 1Password"
run = "mkdir -p talos && op read 'op://Private/Proxmox Talos/kubeconfig' > talos/kubeconfig && chmod 600 talos/kubeconfig"

[tasks.ansible-python-deps]
description = "Install Python dependencies for Ansible modules"
run = "python -m pip install -r ansible/requirements.txt"

[tasks.ansible-galaxy-deps]
description = "Install Ansible roles and collections"
run = [
  "ansible-galaxy collection install -r ansible/requirements.yml",
  "ansible-galaxy role install -r ansible/requirements.yml",
]

[tasks.ansible-deps]
description = "Install all Ansible dependencies"
depends = ["ansible-python-deps", "ansible-galaxy-deps"]

[tasks.syntax-looner]
description = "Run syntax check for the looner playbook"
run = "ansible-playbook -i ansible/inventory.yml ansible/looner.yml --syntax-check"
