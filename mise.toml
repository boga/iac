[tools]
python = "3"
terraform = "latest"

[env]
_.python.venv = { path = ".venv" }

[tasks.ansible-python-deps]
description = "Install Python dependencies for Ansible modules"
run = "python -m pip install -r ansible/requirements.txt"

[tasks.ansible-galaxy-deps]
description = "Install Ansible roles and collections"
run = [
  "ansible-galaxy collection install -r ansible/requirements.yml",
  "ansible-galaxy role install -r ansible/requirements.yml",
]

[tasks.ansible-deps]
description = "Install all Ansible dependencies"
depends = ["ansible-python-deps", "ansible-galaxy-deps"]

[tasks.syntax-looner]
description = "Run syntax check for the looner playbook"
run = "ansible-playbook -i ansible/inventory.yml ansible/looner.yml --syntax-check"


[tasks."tf:init"]
description = "Initialize Terraform with the S3 backend"
run = '''
cd terraform
op run --env-file=../.env.secret -- terraform init \
  -backend-config="bucket=${TF_BACKEND_S3_BUCKET}" \
  -backend-config="region=${AWS_REGION}" \
  -backend-config="endpoints={s3=\"${TF_BACKEND_S3_ENDPOINT}\"}"
'''

[tasks."tf:plan"]
description = "Plan Terraform changes"
run = "cd terraform && op run --env-file=../.env.secret -- terraform plan"

[tasks."tf:apply"]
description = "Apply Terraform changes"
run = "cd terraform && op run --env-file=../.env.secret -- terraform apply"

[tasks."tf:fmt"]
description = "Format Terraform files"
run = "cd terraform && terraform fmt -recursive"
