---
- hosts: all
  become: yes
  gather_facts: false

  vars_prompt:
    - name: ssh_pub_key_local_path
      prompt: Path to SSH public key on local machine
      private: no
      default: "{{ lookup('env', 'PWD') }}/id_ed25519-looner.pub"
    - name: ssh_pub_key_is_exclusive
      prompt: Remove all other non-specified keys from the authorized_keys file?
      private: no
      default: no

  vars:
    - username: ans

  tasks:
    - name: "Add the user {{ username }}"
      user:
        name: "{{ username }}"
        comment: Ansible user
      register: user_created

    - name: "Set authorized key taken from file {{ ssh_pub_key_local_path }}"
      ansible.posix.authorized_key:
        user: "{{ username }}"
        state: present
        key: "{{ lookup('file', '{{ ssh_pub_key_local_path }}') }}"
        exclusive: True
      register: ssh_key_set

    - name: Add Ansible user "{{ username }}" to the sudoers
      community.general.sudoers:
        name: "enable-{{ username }}"
        state: present
        user: "{{ username }}"
        commands: ALL
