---
- name: "Create k8s namespace: {{ namespace_name }}" 
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ namespace_name }}"
    state: present

- name: "Add prometheus-community chart repo"
  kubernetes.core.helm_repository:
    name: prometheus-community
    repo_url: "https://prometheus-community.github.io/helm-charts"

- name: Install Prometheus
  kubernetes.core.helm:
    chart_ref: prometheus-community/kube-prometheus-stack
    name: kube-prometheus-stack
    namespace: "{{ namespace_name }}"
    state: present
    values:
      grafana:
        enabled: false # Grafana is installed via its own playbook
      prometheus:
        prometheusSpec:
          podMonitorSelectorNilUsesHelmValues: false

- name: "Install Grafana ConfigMap: Prometheus datasource"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: grafana-datasource-prometheus
        labels:
          grafana_datasource: "1"
          namespace: o11y
      data:
        datasource.yaml: |-
          apiVersion: 1
          datasources:
          - access: proxy
            basicAuth: false
            editable: false
            isDefault: false
            name: Prometheus
            type: prometheus
            url: http://kube-prometheus-stack-prometheus.o11y.svc.cluster.local:9090
