---
- name: "Install Daemonset"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: promtail-daemonset
      spec:
        selector:
          matchLabels:
            name: promtail
        template:
          metadata:
            labels:
              name: promtail
          spec:
            serviceAccount: promtail-service-account
            containers:
              - name: promtail-container
                image: grafana/promtail
                args:
                  - -config.file=/etc/promtail/promtail.yaml
                env:
                  - name: 'HOSTNAME' # needed when using kubernetes_sd_configs
                    valueFrom:
                      fieldRef:
                        fieldPath: 'spec.nodeName'
                volumeMounts:
                  - name: promtail-config
                    mountPath: /etc/promtail

                  - name: logs
                    mountPath: /var/log
                  - name: home-assistant
                    mountPath: /var/log/home-assistant
                    readOnly: true
                  - mountPath: /var/lib/docker/containers
                    name: varlibdockercontainers
                    readOnly: true
            volumes:
              - name: logs
                hostPath:
                  path: /var/log
              - name: varlibdockercontainers
                hostPath:
                  path: /var/lib/docker/containers
              - name: home-assistant
                hostPath:
                  path: /mnt/home-assistant/home-assistant/config/
              - name: promtail-config
                configMap:
                  name: promtail-config

- name: "Install ConfigMap"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: promtail-config
      data:
        promtail.yaml: |
          server:
            http_listen_port: 9080
            grpc_listen_port: 0

          clients:
          - url: http://loki.o11y.svc.cluster.local:3100/loki/api/v1/push

          positions:
            filename: /tmp/positions.yaml
          target_config:
            sync_period: 10s
          scrape_configs:
          - job_name: home-assistant
            static_configs:
              - targets:
                - localhost
                labels:
                  app: home-assistant
                  __path__: /var/log/home-assistant/home-assistant.log
          - job_name: pod-logs
            kubernetes_sd_configs:
              - role: pod
            pipeline_stages:
              - docker: {}
            relabel_configs:
              - source_labels:
                  - __meta_kubernetes_pod_node_name
                target_label: __host__
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)
              - action: replace
                replacement: $1
                separator: /
                source_labels:
                  - __meta_kubernetes_namespace
                  - __meta_kubernetes_pod_name
                target_label: job
              - action: replace
                source_labels:
                  - __meta_kubernetes_namespace
                target_label: namespace
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_name
                target_label: pod
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_container_name
                target_label: container
              - replacement: /var/log/pods/*$1/*.log
                separator: /
                source_labels:
                  - __meta_kubernetes_pod_uid
                  - __meta_kubernetes_pod_container_name
                target_label: __path__


- name: "Install ClusterRole"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: promtail-cluster-role
      rules:
        - apiGroups: [""]
          resources:
            - nodes
            - services
            - pods
          verbs:
            - get
            - watch
            - list

- name: "Install ServiceAccount"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: promtail-service-account

- name: "Install ClusterRoleBinding"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: promtail-cluster-role-binding
      subjects:
        - kind: ServiceAccount
          name: promtail-service-account
          namespace: "{{ namespace_name }}"
      roleRef:
        kind: ClusterRole
        name: promtail-cluster-role
        apiGroup: rbac.authorization.k8s.io
