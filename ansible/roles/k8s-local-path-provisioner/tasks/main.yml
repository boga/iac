---
- name: "Create namespace: {{ local_path_provisioner_namespace }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ local_path_provisioner_namespace }}"

- name: "Create ServiceAccount"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: local-path-provisioner-service-account
        namespace: "{{ local_path_provisioner_namespace }}"

- name: "Create Role"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: local-path-provisioner-role
        namespace: "{{ local_path_provisioner_namespace }}"
      rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

- name: "Create ClusterRole"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: local-path-provisioner-role
      rules:
        - apiGroups: [""]
          resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["persistentvolumes"]
          verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "patch"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["storageclasses"]
          verbs: ["get", "list", "watch"]

- name: "Create RoleBinding"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: local-path-provisioner-bind
        namespace: "{{ local_path_provisioner_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: local-path-provisioner-role
      subjects:
        - kind: ServiceAccount
          name: local-path-provisioner-service-account
          namespace: "{{ local_path_provisioner_namespace }}"

- name: "Create ClusterRoleBinding"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: local-path-provisioner-bind
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: local-path-provisioner-role
      subjects:
        - kind: ServiceAccount
          name: local-path-provisioner-service-account
          namespace: "{{ local_path_provisioner_namespace }}"

- name: "Create ConfigMap"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
        namespace: "{{ local_path_provisioner_namespace }}"
      data:
        config.json: |-
          {
                  "nodePathMap":[
                  {
                          "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                          "paths":{{ local_path_provisioner_default_paths | to_json }}
                  }
                  ]
          }
        setup: |-
          #!/bin/sh
          set -eu
          mkdir -m 0777 -p "$VOL_DIR"
        teardown: |-
          #!/bin/sh
          set -eu
          rm -rf "$VOL_DIR"
        helperPod.yaml: |-
          apiVersion: v1
          kind: Pod
          metadata:
            name: helper-pod
          spec:
            priorityClassName: system-node-critical
            tolerations:
              - key: node.kubernetes.io/disk-pressure
                operator: Exists
                effect: NoSchedule
            containers:
            - name: helper-pod
              image: docker.io/library/busybox
              imagePullPolicy: IfNotPresent

- name: "Create Deployment"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: local-path-provisioner
        namespace: "{{ local_path_provisioner_namespace }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: local-path-provisioner
        template:
          metadata:
            labels:
              app: local-path-provisioner
          spec:
            serviceAccountName: local-path-provisioner-service-account
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                effect: NoSchedule
            containers:
              - name: local-path-provisioner
                image: "docker.io/rancher/local-path-provisioner:{{ local_path_provisioner_version }}"
                imagePullPolicy: IfNotPresent
                command:
                  - local-path-provisioner
                  - --debug
                  - start
                  - --config
                  - /etc/config/config.json
                volumeMounts:
                  - name: config-volume
                    mountPath: /etc/config/
                env:
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: CONFIG_MOUNT_PATH
                    value: /etc/config/
            volumes:
              - name: config-volume
                configMap:
                  name: local-path-config

- name: "Create StorageClass: {{ local_path_provisioner_storageclass_name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ local_path_provisioner_storageclass_name }}"
      provisioner: rancher.io/local-path
      reclaimPolicy: "{{ local_path_provisioner_reclaim_policy }}"
      volumeBindingMode: "{{ local_path_provisioner_volume_binding_mode }}"

- name: Wait for local-path-provisioner deployment
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    name: local-path-provisioner
    namespace: "{{ local_path_provisioner_namespace }}"
    wait: true
    wait_timeout: 180
