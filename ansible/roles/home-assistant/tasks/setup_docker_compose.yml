---
- name: "Create Home Assitant directory: {{ HOME_ASSISTANT_ROOT_DIR }}"
  ansible.builtin.file:
    path: "{{ HOME_ASSISTANT_ROOT_DIR }}"
    state: directory
    mode: "u=rw,g=r,o=r"

- name: Spin up compose project
  community.docker.docker_compose_v2:
    project_name: home-assistant
    state: present
    definition:
      services:
        homeassistant:
          container_name: homeassistant
          image: "ghcr.io/home-assistant/home-assistant:{{ HOME_ASSISTANT_IMAGE_TAG }}"
          volumes:
            - "{{ HOME_ASSISTANT_ROOT_DIR }}/config:/config"
            - /etc/localtime:/etc/localtime:ro
          devices:
            - "/dev/ttyUSB0:/dev/ttyUSB0"
          restart: unless-stopped
          ports:
            - "{{ HOME_ASSISTANT_PORT }}:8123/tcp"
            - "{{ HOME_ASSISTANT_PORT }}:8123/udp"
        tailscale:
          image: tailscale/tailscale:latest
          hostname: tailscale
          environment:
            TS_AUTHKEY: "{{ vault_nas_docker_vm_containers_oauth_secret_key }}"
            TS_HOSTNAME: home-assistant
            TS_EXTRA_ARGS: "--advertise-tags=tag:server"
            TS_STATE_DIR: /var/lib/tailscale
            TS_USERSPACE: false
          volumes:
            - "{{ homeassistant_docker_volume_dir }}/tailscale/state:/var/lib/tailscale"
          devices:
            - /dev/net/tun:/dev/net/tun
          cap_add:
            - net_admin
          restart: unless-stopped
