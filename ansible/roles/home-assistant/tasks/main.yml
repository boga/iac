---
- name: "Create Home Assistant directory: {{ home_assistant_root_dir }}"
  ansible.builtin.file:
    path: "{{ home_assistant_root_dir }}"
    state: directory
    mode: "u=rw,g=r,o=r"

- name: "Create Home Assistant configuration file: {{ home_assistant_config_file }}"
  ansible.builtin.template:
    src: home-assistant-configuration.yaml.j2
    dest: "{{ home_assistant_config_file }}"
#    owner: docker_pid
#    group: docker_gid
    mode: '0644'

- name: Spin up compose project
  community.docker.docker_compose_v2:
    project_name: "{{ docker_compose_project_name }}"
    state: present
    recreate: always
    definition:
      services:
        homeassistant:
          image: "ghcr.io/home-assistant/home-assistant{{ home_assistant_image_tag }}"
          volumes:
            - "{{ home_assistant_root_dir }}:/config"
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
          devices:
            - "/dev/ttyUSB0:/dev/ttyUSB0"
          depends_on:
            - tailscale
          network_mode: service:tailscale
          restart: unless-stopped
        tailscale:
          image: tailscale/tailscale:latest          
          environment:
            - "TS_AUTHKEY={{ tailscale_client_secret }}"
            - TS_STATE_DIR=/var/lib/tailscale
            - TS_USERSPACE=false
            - TS_EXTRA_ARGS=--advertise-tags=tag:server
            - "TS_HOSTNAME={{ tailscale_hostname }}"
          # hostname: home-assistant
          volumes:
            - "{{ tailscale_root_dir }}:/var/lib/tailscale"
            - /dev/net/tun:/dev/net/tun
          cap_add:
            - NET_ADMIN
            - SYS_MODULE
          restart: unless-stopped
          post_start:
            - command: [
              "tailscale",
              "cert",
              # "--cert-file=/certs/cert.pem",
              # "--key-file=/certs/key.pem",
              "{{ tailscale_hostname }}.{{ tailscale_tailnet_name }}",
            ]

- name: "Get info about a Docker network: {{ docker_network_name }}"
  community.docker.docker_network_info:
    name: "{{ docker_network_name }}"
  register: docker_network_info

- name: Update Home Assistant config file with proper HTTP proxy subnet
  ansible.builtin.lineinfile:
    path: "{{ home_assistant_config_file }}"
    search_string: "    - here-goes-trusted-subnet"
    line: "    - {{ docker_network_info.network.IPAM.Config[0].Subnet }}"
