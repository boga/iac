---
- name: "Create Home Assistant directory: {{ home_assistant_root_dir }}"
  ansible.builtin.file:
    path: "{{ home_assistant_root_dir }}"
    state: directory
    mode: "u=rw,g=r,o=r"

- name: "Create Home Assistant configuration file: {{ home_assistant_config_file }}"
  ansible.builtin.template:
    src: home-assistant-configuration.yaml.j2
    dest: "{{ home_assistant_config_file }}"
#    owner: docker_pid
#    group: docker_gid
    mode: '0644'

- name: Spin up compose project
  community.docker.docker_compose_v2:
    project_name: "{{ docker_compose_project_name }}"
    state: present
    definition:
      services:
        homeassistant:
          image: "ghcr.io/home-assistant/home-assistant{{ home_assistant_image_tag }}"
          volumes:
            - "{{ home_assistant_root_dir }}:/config"
            - /etc/localtime:/etc/localtime:ro
            - /run/dbus:/run/dbus:ro
          devices:
            - "/dev/ttyUSB0:/dev/ttyUSB0"
          labels:
            tsdproxy.enable: "true"
            tsdproxy.name: "home-assistant"
          ports:
            - "{{ node_port }}:{{ http_port }}"
          restart: unless-stopped

- name: "Get info about a Docker network: {{ docker_network_name }}"
  community.docker.docker_network_info:
    name: "{{ docker_network_name }}"
  register: docker_network_info

- name: Update Home Assistant config file with proper HTTP proxy subnet
  ansible.builtin.lineinfile:
    path: "{{ home_assistant_config_file }}"
    search_string: "    - here-goes-trusted-subnet"
    line: "    - {{ docker_network_info.network.IPAM.Config[0].Subnet }}"
