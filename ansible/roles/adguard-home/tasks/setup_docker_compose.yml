---
- name: "Create AdGuard Home directory: {{ ADGUARD_ROOT_DIR }}"
  ansible.builtin.file:
    path: "{{ ADGUARD_ROOT_DIR }}"
    state: directory
    mode: "u=rw,g=r,o=r"

- name: Spin up compose project
  community.docker.docker_compose_v2:
    project_name: adguard-home
    state: present
    definition:
      services:
        adguard-home:
          container_name: adguard-home
          image: "adguard/adguardhome:{{ ADGUARD_IMAGE_TAG }}"
          volumes:
            - "{{ ADGUARD_ROOT_DIR }}/workdir:/opt/adguardhome/work"
            - "{{ ADGUARD_ROOT_DIR }}/confdir:/opt/adguardhome/conf"
          restart: unless-stopped
          ports:
            - "{{ ADGUARD_HTTP_PORT }}:80/tcp"
            - "{{ ADGUARD_HTTP_PORT }}:80/udp"
            # - "443:443/tcp"
            # - "443:443/udp"
            - "53:53/tcp"
            - "53:53/udp"
            # - "5443:5443/tcp"
            # - "5443:5443/udp"
            # - "67:67/udp"
            # - "68:68/udp"
            # - "784:784/udp"
            # - "80:80/tcp"
            # - "853:853/tcp"
            # - "853:853/udp"
            # - "8853:8853/udp"
