---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-workdir-pvc
  labels:
    app: adguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-confdir-pvc
  labels:
    app: adguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
