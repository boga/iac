---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  labels:
    app: adguard
spec:
  selector:
    matchLabels:
      app: adguard
  replicas: 1
  template:
    metadata:
      labels:
        app: adguard
    spec:
      containers:
        - name: adguard
          image: adguard/adguardhome
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 53               
              protocol: TCP
            - containerPort: 53              
              protocol: UDP
            - containerPort: 67              
              protocol: UDP
            - containerPort: 68              
              protocol: UDP
            - containerPort: 443              
              protocol: TCP
            - containerPort: 443              
              protocol: UDP
            - containerPort: 80              
              protocol: TCP
            - containerPort: 3000               
              protocol: TCP
            - containerPort: 853              
              protocol: TCP
            - containerPort: 853              
              protocol: UDP
            - containerPort: 8853              
              protocol: UDP
            - containerPort: 5443              
              protocol: TCP
            - containerPort: 5443              
              protocol: UDP
            - containerPort: 784              
              protocol: UDP
          resources:
            requests:
              cpu: 250m
              memory: 750Mi
            limits:
              cpu: 500m
              memory: 1250Mi
          volumeMounts:
            - mountPath: /opt/adguardhome/work
              name: adguard-work
            - mountPath: /opt/adguardhome/conf
              name: adguard-conf
            # - mountPath: /opt/adguardhome/conf/AdGuardHome.yaml
              # name: adguard-conf-file
              # readOnly: false
              # subPath: AdGuardHome.yaml
      volumes:
        - name: adguard-work
          persistentVolumeClaim:
            claimName: adguard-workdir-pvc
        - name: adguard-conf
          persistentVolumeClaim:
            claimName: adguard-confdir-pvc
        # - name: adguard-conf-file
        #   configMap:
        #     name: adguard
            # items:
            # - key: AdGuardHome.yaml
            #   path: AdGuardHome.yaml
