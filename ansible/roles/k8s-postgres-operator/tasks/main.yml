---
- name: "Create k8s namespace: {{ namespace_name }}"
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ namespace_name }}"
    state: present

- name: "Add operators charts repos"
  kubernetes.core.helm_repository:
    name: "{{ item.repo_name }}"
    repo_url: "{{ item.repo_url }}"
  loop: "{{ charts }}"

- name: Update Helm cache
  kubernetes.core.helm:
    name: dummy
    namespace: kube-system
    state: absent
    update_repo_cache: true

- name: Install the operator
  kubernetes.core.helm:
    chart_ref: "{{ item.chart_ref }}"
    name: "{{ item.release_name }}"
    namespace: "{{ namespace_name }}"
    chart_version: "{{ postgres_operator_chart_version }}"
    state: present
  loop: "{{ charts }}"
