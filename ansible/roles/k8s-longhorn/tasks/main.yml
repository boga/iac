---
- name: "Create k8s namespace: {{ namespace_name }}"
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ namespace_name }}"
    state: present

- name: Add Longhorn chart repo
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"

- name: Install Longhorn
  kubernetes.core.helm:
    chart_ref: "{{ longhorn_chart_ref }}"
    name: "{{ longhorn_release_name }}"
    namespace: "{{ namespace_name }}"
    chart_version: "{{ longhorn_chart_version | default(omit, true) }}"
    state: present
    update_repo_cache: true
    values:
      defaultSettings:
        defaultDataPath: "{{ longhorn_data_path }}"
        defaultReplicaCount: "{{ longhorn_replicas }}"
  register: longhorn_install_result
  retries: 3
  delay: 10
  until: longhorn_install_result is succeeded

- name: Create Longhorn UI ingress
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: longhorn
        labels:
          app: longhorn
      spec:
        ingressClassName: tailscale
        rules:
          - host: "{{ longhorn_ui_host }}"
            http:
              paths:
                - backend:
                    service:
                      name: longhorn-frontend
                      port:
                        name: http
                  path: /
                  pathType: Prefix
        tls:
          - hosts:
              - "{{ longhorn_ui_host }}"

- name: Get a list of all storage classes
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
  register: storage_class_list

- name: Postprocess storage classes list
  ansible.builtin.set_fact:
    storage_classes: "{{ storage_classes | default([]) + [ { 'name': item.metadata.name, 'isDefault': (item.metadata.annotations | default({})).get('storageclass.kubernetes.io/is-default-class', 'false') } ] }}"
  with_items: "{{ storage_class_list.resources }}"

- name: Remove default flag from other storage classes
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ item.name }}"
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
  when: item.isDefault == "true" and item.name != longhorn_storage_class_name
  with_items: "{{ storage_classes | default([]) }}"

- name: Create Longhorn storage class
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ longhorn_storage_class_name }}"
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
      provisioner: driver.longhorn.io
      allowVolumeExpansion: true
      reclaimPolicy: Delete
      volumeBindingMode: Immediate
      parameters:
        numberOfReplicas: "{{ longhorn_replicas }}"
        staleReplicaTimeout: "30"
        fsType: "ext4"
