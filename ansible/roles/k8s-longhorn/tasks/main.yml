---
- name: "Create k8s namespace: {{ namespace_name }}" 
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ namespace_name }}"
    state: present

- name: "Add Longhorn chart repo"
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"

- name: Update Helm cache
  kubernetes.core.helm:
    name: dummy
    namespace: kube-system
    state: absent
    update_repo_cache: true

- name: Install Longhorn
  kubernetes.core.helm:
    chart_ref: longhorn/longhorn
    name: longhorn
    namespace: "{{ namespace_name }}"
    chart_version: 1.5.1
    state: present
    values:
      persistence:
        defaultClass: false

- name: "Create Ingress"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: longhorn
        labels:
          app: longhorn
        annotations:
          ingress.kubernetes.io/rewrite-target: /
      spec:
        rules:
          - host: "longhorn.looner.lan"
            http:
              paths:
                - backend:
                    service:
                      name: longhorn-frontend
                      namespace: longhorn-system
                      port: 
                        name: http
                  path: /
                  pathType: Prefix

- name: "Get a list of all storage classes"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: StorageClass
  register: storage_class_list

- name: "Postprocess storage classes list"
  set_fact:
    storage_classes: "{{ storage_classes|default([]) + [ { 'name': item.metadata.name, 'isDefault': item.metadata.annotations['storageclass.kubernetes.io/is-default-class']|default('true') } ] }}"
    longhornStorageClassIsDefault: "{{ longhornStorageClassIsDefault|default('false') or 'longhorn' == storage_classes[-1]['name'] and 'true' == storage_classes[-1]['isDefault'] }}"
    longhornStorageClassExists: "{{ longhornStorageClassExists|default('false') or 'longhorn' == storage_classes[-1]['name'] }}"
  with_items: "{{ storage_class_list.resources }}"

- name: "Remove 'default' flag from all storage classes"
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - storageclass
      - "{{ item.name }}"
      - -p
      - '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
  when: item.isDefault == "true" and item.name != "longhorn"
  with_items: "{{ storage_classes }}"

- name: "Set 'default' flag to 'longhorn' storage classes"
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - storageclass
      - longhorn
      - -p
      - '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  when: longhornStorageClassExists and not longhornStorageClassIsDefault

- name: "Create StorageClasses for HDD&SSD"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: storage.k8s.io/v1
      kind: StorageClass
      metadata:
        name: "{{ item.name }}"
        annotations:
          storageclass.kubernetes.io/is-default-class: "{{ item.isDefault|default('false') }}"
      provisioner: driver.longhorn.io
      allowVolumeExpansion: true
      reclaimPolicy: "Delete"
      volumeBindingMode: Immediate
      parameters:
        numberOfReplicas: "1"
        staleReplicaTimeout: "30"
        fsType: "ext4"
        diskSelector: "{{ item.diskSelector }}"
        nodeSelector: "storage"
  with_items: 
    - { name: "longhorn-hdd-fast", diskSelector: "hdd-fast", isDefault: "true" }
    - { name: "longhorn-hdd-slow", diskSelector: "hdd-slow" }
    - { name: "longhorn-ssd", diskSelector: "ssd" }
