---
- name: "Create k8s namespace: {{ namespace_name }}" 
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ namespace_name }}"
    state: present

- name: "Add Longhorn chart repo"
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: "https://charts.longhorn.io"

- name: Update Helm cache
  kubernetes.core.helm:
    name: dummy
    namespace: kube-system
    state: absent
    update_repo_cache: true

- name: Install Longhorn
  kubernetes.core.helm:
    chart_ref: longhorn/longhorn
    name: longhorn
    namespace: "{{ namespace_name }}"
    chart_version: 1.5.1
    state: present

- name: "Create Ingress"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: longhorn
        labels:
          app: longhorn
        annotations:
          ingress.kubernetes.io/rewrite-target: /
      spec:
        rules:
          - host: "longhorn.looner.lan"
            http:
              paths:
                - backend:
                    service:
                      name: longhorn-frontend
                      namespace: longhorn-system
                      port: 
                        name: http
                  path: /
                  pathType: Prefix

- name: "Get a list of all storage classes"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: StorageClass
  register: storage_class_list

- name: "Create a dict of storage classes"
  set_fact:
    storage_class_dict: "{{ storage_class_dict|default({}) | combine( {item.metadata.name: item.metadata.annotations['storageclass.kubernetes.io/is-default-class']} ) }}"
  with_items: "{{ storage_class_list.resources }}"

- name: "Remove 'default' flag from all storage classes"
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - storageclass
      - "{{ item.key }}"
      - -p
      - '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
  when: item.value == "true" and item.key != "longhorn"
  with_items: "{{ lookup('dict', storage_class_dict) }}"

- name: "Set 'default' flag to 'longhorn' storage classes"
  ansible.builtin.command:
    argv:
      - kubectl
      - patch
      - storageclass
      - longhorn
      - -p
      - '{"metadata": {"annotations":{"storageclass.kubernetes.io/is-default-class":"true"}}}'
  when: storage_class_dict["longhorn"] == "false"
