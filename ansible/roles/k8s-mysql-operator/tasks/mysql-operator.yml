---
- name: "Create k8s namespace: {{ namespace_name }}"
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ namespace_name }}"
    state: present

- name: "Add MySQL operator chart repo"
  kubernetes.core.helm_repository:
    name: mysql-operator
    repo_url: "https://mysql.github.io/mysql-operator/"

- name: Update Helm cache
  kubernetes.core.helm:
    name: dummy
    namespace: kube-system
    state: absent
    update_repo_cache: true

- name: Install the operator
  kubernetes.core.helm:
    chart_ref: mysql-operator/mysql-operator
    name: mysql-operator
    namespace: "{{ namespace_name }}"
    chart_version: "{{ mysql_operator_chart_version }}"
    state: present
