---
- name: Create Immich namespace
  kubernetes.core.k8s:
    name: "{{ immich_namespace }}"
    api_version: v1
    kind: Namespace
    state: present

- name: Create Immich library PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{ immich_library_pvc_name }}"
        namespace: "{{ immich_namespace }}"
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: "{{ immich_library_storage_size }}"
        storageClassName: "{{ immich_storage_class }}"

- name: Add Immich chart repo
  kubernetes.core.helm_repository:
    name: immich
    repo_url: "https://immich-app.github.io/immich-charts"

- name: Install Immich chart
  kubernetes.core.helm:
    chart_ref: immich/immich
    name: "{{ immich_release_name }}"
    namespace: "{{ immich_namespace }}"
    create_namespace: true
    chart_version: "{{ immich_chart_version }}"
    values:
      controllers:
        main:
          containers:
            main:
              env:
                DB_HOSTNAME: "{{ immich_db_hostname }}"
                DB_PORT: "{{ immich_db_port }}"
                DB_USERNAME: "{{ immich_db_username }}"
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: "{{ immich_db_secret_name }}"
                      key: password
                DB_DATABASE_NAME: "{{ immich_db_name }}"
      immich:
        persistence:
          library:
            existingClaim: "{{ immich_library_pvc_name }}"
      valkey:
        enabled: true
        persistence:
          data:
            size: 1Gi
            storageClass: "{{ immich_storage_class }}"
      machine-learning:
        persistence:
          cache:
            size: 2Gi
            storageClass: "{{ immich_storage_class }}"
    wait: true
    state: present
  register: immich_install_result
  # To overcome the issue with "helm --all" in kubernetes.core.helm:
  retries: 3
  delay: 10
  until: immich_install_result is succeeded

- name: Create Tailscale Ingress for Immich
  kubernetes.core.k8s:
    state: present
    namespace: "{{ immich_namespace }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: immich-tailscale
        annotations:
          gethomepage.dev/description: "Immich photo management"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Apps"
          gethomepage.dev/icon: "immich.png"
          gethomepage.dev/name: "Immich"
          gethomepage.dev/pod-selector: "app.kubernetes.io/name=server,app.kubernetes.io/instance={{ immich_release_name }}"
      spec:
        ingressClassName: tailscale
        tls:
          - hosts:
              - "{{ immich_tailscale_hostname }}"
        rules:
          - host: "{{ immich_tailscale_hostname }}"
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: "{{ immich_service_name }}"
                      port:
                        name: "{{ immich_service_port_name }}"
