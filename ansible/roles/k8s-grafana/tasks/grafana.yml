- name: Add Grafana chart repo
  kubernetes.core.helm_repository:
    name: grafana
    repo_url: "https://grafana.github.io/helm-charts"

- name: Install Grafana
  kubernetes.core.helm:
    chart_ref: grafana/grafana
    name: grafana
    namespace: "{{ namespace_name }}"
    chart_version: "{{ grafana_chart_version }}"
    state: present
    update_repo_cache: true
    values:
      persistence:
        enabled: "{{ grafana_persistence_enabled }}"
        storageClassName: "{{ grafana_storage_class }}"
        size: "{{ grafana_storage_size }}"
      sidecar:
        datasources:
          enabled: true
          skipReload: false
      plugins:
        - "victoriametrics-logs-datasource 0.31.0"
  register: grafana_install_result
  # To overcome the issue with "helm --all" in kubernetes.core.helm:
  retries: 3
  delay: 10
  until: grafana_install_result is succeeded

- name: "Create Ingress for Grafana"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    definition:
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: grafana
        labels:
          app: grafana
        annotations:
          gethomepage.dev/description: "Grafana dashboards"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Observability"
          gethomepage.dev/icon: "grafana.png"
          gethomepage.dev/name: "Grafana"
      spec:
        ingressClassName: tailscale
        rules:
          - host: "{{ grafana_ingress_host }}"
            http:
              paths:
                - backend:
                    service:
                      name: grafana
                      port:
                        name: service
                  path: /
                  pathType: Prefix
        tls:
          - hosts:
              - "{{ grafana_ingress_host }}"
