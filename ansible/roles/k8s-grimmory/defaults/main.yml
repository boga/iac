---
namespace_name: "grimmory"

grimmory_name: "grimmory"
grimmory_image: "grimmory/grimmory:latest"
grimmory_image_pull_policy: "Always"
grimmory_replicas: 1
grimmory_port: 6060

grimmory_tailscale_name: "tailscale"
grimmory_tailscale_image: "tailscale/tailscale:v1.98.4"
grimmory_tailscale_image_pull_policy: "IfNotPresent"
grimmory_tailscale_hostname: "library"
grimmory_tailscale_authkey: "{{ tailscale_client_secret }}"
grimmory_tailscale_secret_name: "grimmory-tailscale-auth"
grimmory_tailscale_state_pvc_name: "grimmory-tailscale-state"
grimmory_tailscale_state_dir: "/var/lib/tailscale"
grimmory_tailscale_state_storage_size: "1Gi"
grimmory_tailscale_state_storage_class_name: >-
  {{ grimmory_storage_class_name | default('local-path') }}
grimmory_tailscale_serve_config_name: "grimmory-tailscale-serve"
grimmory_tailscale_health_check_port: 9002
grimmory_tailscale_operator_namespace: "tailscale"
grimmory_tailscale_advertise_tag: "tag:server"
grimmory_tailscale_identity_release_acknowledged: false

grimmory_db_host: "grimmory-mariadb"
grimmory_db_port: 3306
grimmory_db_name: "grimmory"
grimmory_db_user: "grimmory"
grimmory_db_password_secret_name: "grimmory-mariadb-grimmory-all-mariadb-user"

grimmory_mariadb_release_name: "grimmory-mariadb"
grimmory_mariadb_cluster_name: "grimmory-mariadb"
grimmory_mariadb_replicas: 1
grimmory_mariadb_galera_enabled: false
grimmory_mariadb_storage_size: "5Gi"
