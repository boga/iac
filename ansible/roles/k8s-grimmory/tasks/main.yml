---
- name: "Create k8s namespace: {{ namespace_name }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ namespace_name }}"

- name: Validate Grimmory Tailscale sidecar prerequisites
  ansible.builtin.assert:
    that:
      - grimmory_replicas | int == 1
      - grimmory_tailscale_authkey is defined
      - grimmory_tailscale_authkey | trim | length > 0
      - grimmory_tailscale_advertise_tag == "tag:server"
    fail_msg: >-
      Grimmory requires one replica, a non-empty Tailscale auth key, and the
      approved tag:server advertise tag before the sidecar cutover.
  no_log: true

- name: "Create MariaDB cluster for Grimmory"
  ansible.builtin.include_role:
    name: k8s-mariadb-cluster
  vars:
    mariadb_cluster_namespace: "{{ namespace_name }}"
    mariadb_cluster_release_name: "{{ grimmory_mariadb_release_name }}"
    mariadb_cluster_name: "{{ grimmory_mariadb_cluster_name }}"
    mariadb_cluster_replicas: "{{ grimmory_mariadb_replicas }}"
    mariadb_cluster_galera_enabled: "{{ grimmory_mariadb_galera_enabled }}"
    mariadb_cluster_storage_size: "{{ grimmory_mariadb_storage_size }}"
    mariadb_cluster_databases:
      - name: "{{ grimmory_db_name }}"
        characterSet: utf8mb4
        collate: utf8mb4_unicode_ci
    mariadb_cluster_users:
      - name: "{{ grimmory_db_user }}"
        secret_name: "{{ grimmory_db_password_secret_name }}"
    mariadb_cluster_grants:
      - name: "{{ grimmory_db_user }}-{{ grimmory_db_name }}"
        privileges:
          - SELECT
          - INSERT
          - UPDATE
          - DELETE
          - CREATE
          - CREATE TEMPORARY TABLES
          - ALTER
          - DROP
          - INDEX
          - REFERENCES
        database: "{{ grimmory_db_name }}"
        table: "*"
        username: "{{ grimmory_db_user }}"
        host: "%"

- name: Record Grimmory restart baseline
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ namespace_name }}"
    label_selectors:
      - "app.kubernetes.io/name={{ grimmory_name }}"
  register: grimmory_pod_info

- name: Report Grimmory restart baseline
  ansible.builtin.debug:
    msg: >-
      Grimmory restart counts before Tailscale sidecar rollout: {{
      grimmory_pod_info.resources
      | map(attribute='status.containerStatuses')
      | select('defined')
      | flatten
      | selectattr('name', 'equalto', grimmory_name)
      | map(attribute='restartCount')
      | list
      }}

- name: "Create Grimmory database secret"
  kubernetes.core.k8s:
    state: present
    template: secret.yml.j2

- name: "Create Grimmory Tailscale auth secret"
  kubernetes.core.k8s:
    state: present
    template: tailscale-secret.yml.j2
  no_log: true

- name: "Create Grimmory Tailscale Serve config"
  kubernetes.core.k8s:
    state: present
    template: tailscale-serve-config.yml.j2

- name: "Create Grimmory persistent volumes"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    template: pvc.yml.j2

- name: "Create Grimmory service"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    template: service.yml.j2

- name: "Deploy Grimmory app with Tailscale sidecar"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ namespace_name }}"
    template: deployment.yml.j2
    wait: true
    wait_timeout: 300
