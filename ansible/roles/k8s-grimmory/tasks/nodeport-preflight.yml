---
- name: Validate configured Grimmory NodePort
  ansible.builtin.assert:
    that:
      - grimmory_node_port is integer
    fail_msg: grimmory_node_port must be an integer.

- name: Get Kubernetes API server pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: kube-system
    label_selectors:
      - component=kube-apiserver
  register: grimmory_api_server_pods

- name: Require a single Kubernetes API server for NodePort range discovery
  ansible.builtin.assert:
    that:
      - grimmory_api_server_pods.resources | length == 1
    fail_msg: >-
      Unable to determine the authoritative NodePort range: expected exactly one
      kube-apiserver pod, found {{ grimmory_api_server_pods.resources | length }}.

- name: Get Kubernetes API server NodePort range default
  kubernetes.core.k8s_exec:
    namespace: kube-system
    pod: "{{ grimmory_api_server_pods.resources[0].metadata.name }}"
    container: kube-apiserver
    command: /usr/local/bin/kube-apiserver --help
  register: grimmory_api_server_help
  changed_when: false
  failed_when: false

- name: Get Kubernetes API server command and arguments
  ansible.builtin.set_fact:
    grimmory_api_server_command: >-
      {{ grimmory_api_server_pods.resources[0].spec.containers
         | selectattr('name', 'equalto', 'kube-apiserver')
         | map(attribute='command')
         | first
         | default([], true) }}
    grimmory_api_server_args: >-
      {{ grimmory_api_server_pods.resources[0].spec.containers
         | selectattr('name', 'equalto', 'kube-apiserver')
         | map(attribute='args')
         | first
         | default([], true) }}
    grimmory_api_server_default_nodeport_range: >-
      {{ grimmory_api_server_help.stdout | default('')
         | regex_findall('(?m)^\\s*--service-node-port-range.*\\(default ([0-9]+-[0-9]+)\\)')
         | first
         | default('', true) }}

- name: Build Kubernetes API server effective arguments
  ansible.builtin.set_fact:
    grimmory_api_server_argv: >-
      {{ grimmory_api_server_command + grimmory_api_server_args }}

- name: Parse Kubernetes API server NodePort range arguments
  ansible.builtin.set_fact:
    grimmory_api_server_nodeport_range_arguments: >-
      {{ grimmory_api_server_argv
         | select('match', '^--service-node-port-range=')
         | map('regex_replace', '^--service-node-port-range=', '')
         | list }}
    grimmory_api_server_has_unparsed_nodeport_range_argument: >-
      {{ grimmory_api_server_argv
         | select('equalto', '--service-node-port-range')
         | list
         | length > 0 }}

- name: Require an authoritative Kubernetes API server NodePort range
  ansible.builtin.assert:
    that:
      - grimmory_api_server_argv | length > 0
      - grimmory_api_server_nodeport_range_arguments | length <= 1
      - not grimmory_api_server_has_unparsed_nodeport_range_argument
      - grimmory_api_server_help.return_code | default(1) == 0
      - grimmory_api_server_default_nodeport_range is match('^[0-9]+-[0-9]+$')
      - >-
        (grimmory_api_server_nodeport_range_arguments | length == 1 and
        grimmory_api_server_nodeport_range_arguments[0] is match('^[0-9]+-[0-9]+$')) or
        grimmory_api_server_nodeport_range_arguments | length == 0
    fail_msg: Unable to determine the authoritative NodePort range from the live kube-apiserver.

- name: Set authoritative Kubernetes API server NodePort range
  ansible.builtin.set_fact:
    grimmory_live_nodeport_range: >-
      {{ grimmory_api_server_nodeport_range_arguments[0]
         if grimmory_api_server_nodeport_range_arguments | length == 1
         else grimmory_api_server_default_nodeport_range }}

- name: Split authoritative Kubernetes API server NodePort range
  ansible.builtin.set_fact:
    grimmory_live_nodeport_range_bounds: "{{ grimmory_live_nodeport_range.split('-') | map('int') | list }}"

- name: Verify Grimmory NodePort is within the live range
  ansible.builtin.assert:
    that:
      - grimmory_live_nodeport_range_bounds[0] <= grimmory_live_nodeport_range_bounds[1]
      - grimmory_node_port >= grimmory_live_nodeport_range_bounds[0]
      - grimmory_node_port <= grimmory_live_nodeport_range_bounds[1]
    fail_msg: >-
      grimmory_node_port {{ grimmory_node_port }} is outside the live Kubernetes
      NodePort range {{ grimmory_live_nodeport_range }}.

- name: Get all Kubernetes Services
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
  register: grimmory_services

- name: Require complete Kubernetes Service inventory
  ansible.builtin.assert:
    that:
      - grimmory_services.api_found | default(false)
    fail_msg: >-
      Unable to determine Grimmory NodePort availability: Kubernetes Service API was not found.

- name: Initialize Grimmory NodePort collision list
  ansible.builtin.set_fact:
    grimmory_nodeport_collisions: []

- name: Find Grimmory NodePort collisions
  ansible.builtin.set_fact:
    grimmory_nodeport_collisions: >-
      {{ grimmory_nodeport_collisions + [item.metadata.namespace ~ '/' ~ item.metadata.name] }}
  loop: "{{ grimmory_services.resources }}"
  when:
    - item.metadata.namespace != namespace_name or item.metadata.name != grimmory_name
    - >-
      (item.spec.ports | default([])
      | selectattr('nodePort', 'defined')
      | map(attribute='nodePort')
      | select('equalto', grimmory_node_port)
      | list
      | length > 0) or
      (item.spec.healthCheckNodePort | default(-1) == grimmory_node_port)

- name: Require Grimmory NodePort to be unallocated
  ansible.builtin.assert:
    that:
      - grimmory_nodeport_collisions | length == 0
    fail_msg: >-
      grimmory_node_port {{ grimmory_node_port }} is already allocated by:
      {{ grimmory_nodeport_collisions | join(', ') }}.
