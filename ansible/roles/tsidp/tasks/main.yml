---
- name: Spin up compose project
  community.docker.docker_compose_v2:
    project_name: "{{ docker_compose_project_name }}"
    state: present
    definition:
      services:
        tsidp:
          image: "{{ image }}"
          ports:
            - "{{ node_port }}:443"
          environment:
            TS_AUTHKEY: "tskey-auth-kfxpb6sXf911CNTRL-St4kF6jBoCEjio3LWMp44EMvRSsjFc9ad"
            TS_USERSPACE: false
            TS_HOSTNAME: "idp"
            TAILSCALE_USE_WIP_CODE: 1
          volumes:
            - "{{ tsidp_dir }}:/var/lib/tsidp"
          restart: unless-stopped
