---
- name: Spin up compose project
  community.docker.docker_compose_v2:
    project_name: "{{ docker_compose_project_name }}"
    state: present
    definition:
      services:
        tsidp:
          image: "{{ image }}"
          environment:
            TS_AUTHKEY: "{{ ts_authkey }}"
            TS_USERSPACE: false
            TS_HOSTNAME: "idp"
            TAILSCALE_USE_WIP_CODE: 1
          volumes:
            - "{{ tsidp_dir }}:/var/lib/tsidp"
          restart: unless-stopped
