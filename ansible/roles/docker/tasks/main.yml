---
- name: "Create directory: /etc/apt/keyrings"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: 0755
    group: root
    owner: root

- name: Download Docker GPG apt Key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "u=rw,g=r,o=r"

- name: "Add Docker repo"
  copy:
    dest: "/etc/apt/sources.list.d/docker.list"
    content: |
      deb [arch=arm64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian bullseye stable

- name: Update Docker repo
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker
  ansible.builtin.apt:
    state: latest
    package:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin

- name: Install Docker Module for Python
  ansible.builtin.pip:
    name: docker
