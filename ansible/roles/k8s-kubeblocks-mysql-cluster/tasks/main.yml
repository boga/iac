---
- name: "Create k8s namespace: {{ kb_mysql_namespace }}"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ kb_mysql_namespace }}"

- name: Create KubeBlocks MySQL Cluster
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps.kubeblocks.io/v1
      kind: Cluster
      metadata:
        name: "{{ kb_mysql_cluster_name }}"
        namespace: "{{ kb_mysql_namespace }}"
      spec:
        terminationPolicy: Delete
        componentSpecs:
          - name: mysql
            componentDef: "{{ kb_mysql_component_def }}"
            serviceVersion: "{{ kb_mysql_version }}"
            replicas: "{{ kb_mysql_replicas }}"
            resources:
              limits:
                cpu: "{{ kb_mysql_cpu }}"
                memory: "{{ kb_mysql_memory }}"
              requests:
                cpu: "{{ kb_mysql_cpu }}"
                memory: "{{ kb_mysql_memory }}"
            volumeClaimTemplates:
              - name: data
                spec:
                  storageClassName: "{{ kb_mysql_storage_class }}"
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: "{{ kb_mysql_storage }}"

- name: Wait for MySQL cluster to be ready
  kubernetes.core.k8s_info:
    api_version: apps.kubeblocks.io/v1
    kind: Cluster
    name: "{{ kb_mysql_cluster_name }}"
    namespace: "{{ kb_mysql_namespace }}"
  register: mysql_cluster
  until:
    - mysql_cluster.resources | length > 0
    - mysql_cluster.resources[0].status is defined
    - mysql_cluster.resources[0].status.phase is defined
    - mysql_cluster.resources[0].status.phase == "Running"
  retries: 60
  delay: 10

- name: Initialize processed users list
  set_fact:
    kb_mysql_users_processed: []
  when: kb_mysql_users | length > 0

- name: Validate user passwords (empty string not allowed)
  ansible.builtin.fail:
    msg: "User '{{ item.name }}' has an empty password. Either provide a valid password or omit the password field to auto-generate one."
  loop: "{{ kb_mysql_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - kb_mysql_users | length > 0
    - item.password is defined
    - item.password | length == 0
  no_log: true

- name: Get existing MySQL user secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ kb_mysql_cluster_name }}-{{ item.name }}-mysql-user"
    namespace: "{{ kb_mysql_namespace }}"
  loop: "{{ kb_mysql_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: kb_mysql_existing_user_secrets
  when: kb_mysql_users | length > 0
  no_log: true

- name: Build existing MySQL user password map
  set_fact:
    kb_mysql_existing_user_passwords: >-
      {{ kb_mysql_existing_user_passwords | default({}) | combine({
        item.item.name: item.resources[0].data.password | b64decode
      }) }}
  loop: "{{ kb_mysql_existing_user_secrets.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - kb_mysql_users | length > 0
    - item.resources | length > 0
    - item.resources[0].data.password is defined
  no_log: true

- name: Process MySQL users (reuse existing or auto-generate missing passwords)
  set_fact:
    kb_mysql_users_processed: >-
      {{ kb_mysql_users_processed + [item | combine({'password':
         item.password | default(
           (kb_mysql_existing_user_passwords | default({})).get(item.name, lookup('password', '/dev/null length=24 chars=ascii_letters,digits'))
         )
         })] }}
  loop: "{{ kb_mysql_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: kb_mysql_users | length > 0
  no_log: true

- name: Get MySQL root password
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ kb_mysql_cluster_name }}-mysql-account-root"
    namespace: "{{ kb_mysql_namespace }}"
  register: mysql_root_secret
  until: mysql_root_secret.resources | length > 0
  retries: 10
  delay: 5
  when: kb_mysql_users | length > 0
  no_log: true

- name: Set root password fact
  set_fact:
    kb_mysql_root_password: "{{ mysql_root_secret.resources[0].data.password | b64decode }}"
  when: kb_mysql_users | length > 0
  no_log: true

# Ansible-side b64 encoding avoids shell quoting issues when passing
# the root password through k8s_exec (which doesn't support the env parameter).
- name: Set .my.cnf content fact
  set_fact:
    my_cnf_b64: "{{ ('[client]\nuser=root\npassword=' + (kb_mysql_root_password | replace('\n', ''))) | b64encode }}"
  no_log: true
  when: kb_mysql_users | length > 0

- name: Configure MySQL databases and users
  block:
    - name: Write .my.cnf with root credentials to pod
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_mysql_namespace }}"
        pod: "{{ kb_mysql_cluster_name }}-mysql-0"
        container: mysql
        command: "sh -c 'echo {{ my_cnf_b64 }} | base64 -d > /tmp/.my.cnf && chmod 600 /tmp/.my.cnf'"
      no_log: true

    - name: Verify .my.cnf was written
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_mysql_namespace }}"
        pod: "{{ kb_mysql_cluster_name }}-mysql-0"
        container: mysql
        command: head -1 /tmp/.my.cnf
      register: my_cnf_check
      failed_when: "'[client]' not in my_cnf_check.stdout"

    - name: Create MySQL databases
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_mysql_namespace }}"
        pod: "{{ kb_mysql_cluster_name }}-mysql-0"
        container: mysql
        command: >-
          mysql --defaults-file=/tmp/.my.cnf -e "CREATE DATABASE IF NOT EXISTS `{{ item.1.name }}`;"
      loop: "{{ kb_mysql_users_processed | subelements('databases', skip_missing=True) }}"
      loop_control:
        label: "{{ item.1.name }}"
      no_log: true

    # Build SQL scripts and secret data as facts with no_log to prevent password exposure in verbose mode.
    # The sensitive content is only expanded here; subsequent tasks reference pre-built facts.
    - name: Build SQL scripts and secret data (protected)
      set_fact:
        kb_mysql_sql_scripts: >-
          {{ kb_mysql_sql_scripts | default({}) | combine({
            item.name: {
              'sql_b64': sql_content | b64encode,
              'secret_data': {'password': item.password}
            }
          }) }}
      vars:
        sql_content: |
          CREATE USER IF NOT EXISTS '{{ item.name }}'@'%' IDENTIFIED BY '{{ item.password | replace("'", "''") }}';
          {% for db in item.databases | default([]) -%}
          GRANT {{ db.privileges | default("ALL PRIVILEGES") }} ON `{{ db.name }}`.* TO '{{ item.name }}'@'%';
          {% endfor -%}
          FLUSH PRIVILEGES;
      loop: "{{ kb_mysql_users_processed }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Write SQL setup script to pod
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_mysql_namespace }}"
        pod: "{{ kb_mysql_cluster_name }}-mysql-0"
        container: mysql
        command: "sh -c 'echo {{ kb_mysql_sql_scripts[item.name].sql_b64 }} | base64 -d > /tmp/setup_{{ item.name }}.sql'"
      loop: "{{ kb_mysql_users_processed }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Execute SQL setup script
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_mysql_namespace }}"
        pod: "{{ kb_mysql_cluster_name }}-mysql-0"
        container: mysql
        command: "sh -c 'mysql --defaults-file=/tmp/.my.cnf < /tmp/setup_{{ item.name }}.sql'"
      loop: "{{ kb_mysql_users_processed }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
  always:
    - name: Clean up SQL setup script
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_mysql_namespace }}"
        pod: "{{ kb_mysql_cluster_name }}-mysql-0"
        container: mysql
        command: "rm -f /tmp/setup_{{ item.name }}.sql"
      loop: "{{ kb_mysql_users_processed }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Clean up .my.cnf
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_mysql_namespace }}"
        pod: "{{ kb_mysql_cluster_name }}-mysql-0"
        container: mysql
        command: rm -f /tmp/.my.cnf
      no_log: true
  when: kb_mysql_users | length > 0

- name: Create Kubernetes Secret for each user
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ kb_mysql_cluster_name }}-{{ item.name }}-mysql-user"
        namespace: "{{ kb_mysql_namespace }}"
      type: Opaque
      stringData: "{{ kb_mysql_sql_scripts[item.name].secret_data }}"
  loop: "{{ kb_mysql_users_processed }}"
  loop_control:
    label: "{{ item.name }}"
  when: kb_mysql_users | length > 0
  no_log: true
