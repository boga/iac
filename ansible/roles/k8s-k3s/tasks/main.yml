---
- name: Remove k3s before installing a new
  ansible.builtin.stat:
    path: "{{ k3s_systemd_service_file }}"
  register: k3s_systemd_service_file_output

- name: Check if systemd file already exists
  ansible.builtin.stat:
    path: "{{ k3s_systemd_service_file }}"
  register: k3s_systemd_service_file_output

- name: End play if k3s is installed already
  ansible.builtin.meta: end_play
  when: k3s_systemd_service_file_output.stat.exists and not force_installation

- name: Create a temporary directory
  ansible.builtin.file:
    path: "{{ k3s_tmp_dir }}"
    state: 'directory'
    mode: '0700'
  notify:
    - Remove k3s temporary directory

- name: Download k3s install script
  ansible.builtin.get_url:
    url: "https://get.k3s.io"
    dest: "{{ k3s_install_script }}"
    mode: '0700'

- name: Run install script
  become: true
  ansible.builtin.command:
    cmd: "{{ k3s_install_script }}"
  notify:
    - Enable and restart k3s service

- name: Fetching kubeconfig from remote host
  become: true
  ansible.builtin.fetch:
    src: "{{ k3s_kubeconfig }}"
    dest: "{{ k3s_kubeconfig_local }}"
    flat: true

- name: Prints local kubeconfig path
  ansible.builtin.debug:
    msg: "kubeconfig was saved to {{ k3s_kubeconfig_local }}"
