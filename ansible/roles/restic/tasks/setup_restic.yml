---
- name: Install Restic's package
  ansible.builtin.apt:
    state: latest
    package:
      - restic

- name: Update restic to recent version
  ansible.builtin.command:
    argv:
      - restic
      - self-update

- name: Check if repo exists
  ansible.builtin.command:
    argv:
      - restic
      - cat
      - config
  environment:
    RESTIC_REPOSITORY: "{{ RESTIC_REPOSITORY }}"
    RESTIC_PASSWORD: "{{ RESTIC_PASSWORD }}"
    AWS_DEFAULT_REGION: "{{ RESTIC_AWS_DEFAULT_REGION }}"
    AWS_SECRET_ACCESS_KEY: "{{ RESTIC_AWS_SECRET_ACCESS_KEY }}"
    AWS_ACCESS_KEY_ID: "{{ RESTIC_AWS_ACCESS_KEY_ID }}"
  register: repo_exists_output
  ignore_errors: true

- name: Create repo (if needed)
  ansible.builtin.command:
    argv:
      - restic
      - init
  environment:
    RESTIC_REPOSITORY: "{{ RESTIC_REPOSITORY }}"
    RESTIC_PASSWORD: "{{ RESTIC_PASSWORD }}"
    AWS_DEFAULT_REGION: "{{ RESTIC_AWS_DEFAULT_REGION }}"
    AWS_SECRET_ACCESS_KEY: "{{ RESTIC_AWS_SECRET_ACCESS_KEY }}"
    AWS_ACCESS_KEY_ID: "{{ RESTIC_AWS_ACCESS_KEY_ID }}"
  # https://restic.readthedocs.io/en/stable/075_scripting.html#check-if-a-repository-is-already-initialized
  when: 10 == repo_exists_output['rc']

- name: "Create config directory if it does not exist: {{ CONFIG_DIRECTORY }}"
  ansible.builtin.file:
    path: "{{ CONFIG_DIRECTORY }}"
    state: directory
    mode: '0777'

- name: Add a line to the file
  ansible.builtin.lineinfile:
    path: "{{ CONFIG_DIRECTORY }}/{{ item.file_path }}"
    line: "{{ item.value }}"
    create: yes
  loop:
    - file_path: RESTIC_REPOSITORY
      value: "{{ RESTIC_REPOSITORY }}"
    - file_path: RESTIC_PASSWORD
      value: "{{ RESTIC_PASSWORD }}"
    - file_path: AWS_DEFAULT_REGION
      value: "{{ RESTIC_AWS_DEFAULT_REGION }}"
    - file_path: AWS_SECRET_ACCESS_KEY
      value: "{{ RESTIC_AWS_SECRET_ACCESS_KEY }}"
    - file_path: AWS_ACCESS_KEY_ID
      value: "{{ RESTIC_AWS_ACCESS_KEY_ID }}"

- name: Add cronjob to backup to S3
  ansible.builtin.cron:
    name: "backup to s3"
    hour: "{{ HOUR }}"
    minute: "{{ MINUTE }}"
    job: "                                                                           \
        RESTIC_REPOSITORY=$(cat '{{ CONFIG_DIRECTORY }}/RESTIC_REPOSITORY')          \
        RESTIC_PASSWORD=$(cat '{{ CONFIG_DIRECTORY }}/RESTIC_PASSWORD')              \
        AWS_DEFAULT_REGION=$(cat '{{ CONFIG_DIRECTORY }}/AWS_DEFAULT_REGION')        \
        AWS_SECRET_ACCESS_KEY=$(cat '{{ CONFIG_DIRECTORY }}/AWS_SECRET_ACCESS_KEY')  \
        AWS_ACCESS_KEY_ID=$(cat '{{ CONFIG_DIRECTORY }}/AWS_ACCESS_KEY_ID')          \
        restic --verbose backup {{ BACKUP_SUBJECT_DIR }}                             \
    "
