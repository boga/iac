---
- name: Install necessary packages
  apt:
    name: [ "curl", "bzip2", "jq" ]
    state: present

- name: Check if Restic archive exists
  stat:
    path: "{{ restic_tmp_path }}"
  register: archive_check

- name: Download Restic archive if not exists
  get_url:
    url: "{{ restic_download_url }}"
    dest: "{{ restic_archive_tmp_path }}"
  when: not archive_check.stat.exists

- name: Extract Restic binary if not already extracted
  command: "bunzip2 --keep {{ restic_archive_tmp_path }}"
  args:
    creates: "{{ restic_tmp_path }}"

- name: "Move Restic binary: {{ restic_binary_path }}"
  command: "mv {{ restic_tmp_path }} {{ restic_binary_path }}"
  args:
    creates: "{{ restic_binary_path }}"

- name: Set executable permissions for Restic binary
  file:
    path: "{{ restic_binary_path }}"
    mode: '0755'
