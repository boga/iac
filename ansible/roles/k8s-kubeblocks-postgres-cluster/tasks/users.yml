---
- name: Initialize processed PostgreSQL users
  ansible.builtin.set_fact:
    kb_postgres_users_processed: []
    kb_postgres_user_passwords_processed: []
  when: kb_postgres_users | length > 0
  no_log: true

- name: Validate PostgreSQL user passwords
  ansible.builtin.fail:
    msg: "User '{{ item.name }}' has an empty password. Either provide a valid password or omit the password field to auto-generate one."
  loop: "{{ kb_postgres_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.password is defined
    - item.password | length == 0

- name: Validate PostgreSQL users are unique by name
  ansible.builtin.assert:
    that:
      - kb_postgres_users | map(attribute='name') | list | length == kb_postgres_users | map(attribute='name') | unique | list | length
    fail_msg: "kb_postgres_users must not contain duplicate names."
  when: kb_postgres_users | length > 0

- name: Get existing PostgreSQL user Secrets
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ item.secret_name | default(kb_postgres_cluster_name + '-' + (item.name | lower | regex_replace('[^a-z0-9-]+', '-') | regex_replace('(^-|-$)', '')) + '-postgres-user') }}"
    namespace: "{{ kb_postgres_namespace }}"
  register: kb_postgres_existing_user_secrets
  loop: "{{ kb_postgres_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: kb_postgres_users | length > 0
  no_log: true

- name: Process PostgreSQL user passwords
  ansible.builtin.set_fact:
    kb_postgres_user_passwords_processed: >-
      {{ kb_postgres_user_passwords_processed + [{
        'name': item.name,
        'secret_name': item.secret_name | default(kb_postgres_cluster_name + '-' + (item.name | lower | regex_replace('[^a-z0-9-]+', '-') | regex_replace('(^-|-$)', '')) + '-postgres-user'),
        'password': item.password | default(
          (
            kb_postgres_existing_user_secrets.results[user_index].resources[0].data[kb_postgres_user_secret_key] | b64decode
          )
          if (
            kb_postgres_existing_user_secrets.results[user_index].resources | length > 0
            and kb_postgres_existing_user_secrets.results[user_index].resources[0].data is defined
            and kb_postgres_existing_user_secrets.results[user_index].resources[0].data[kb_postgres_user_secret_key] is defined
            and (
              kb_postgres_existing_user_secrets.results[user_index].resources[0].data[kb_postgres_user_secret_key] | b64decode | length
            ) > 0
          )
          else lookup('password', '/dev/null length=24 chars=ascii_letters,digits')
        )
      }] }}
  loop: "{{ kb_postgres_users }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: user_index
  when: kb_postgres_users | length > 0
  no_log: true

- name: Create Kubernetes Secret for each PostgreSQL user
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ item.secret_name }}"
        namespace: "{{ kb_postgres_namespace }}"
      type: Opaque
      stringData: "{{ {kb_postgres_user_secret_key: item.password} }}"
  loop: "{{ kb_postgres_user_passwords_processed | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: kb_postgres_users | length > 0
  no_log: true

- name: Build PostgreSQL users with passwords
  ansible.builtin.set_fact:
    kb_postgres_users_processed: >-
      {{ kb_postgres_users_processed + [
        item
        | combine({
          'secret_name': item.secret_name | default(kb_postgres_cluster_name + '-' + (item.name | lower | regex_replace('[^a-z0-9-]+', '-') | regex_replace('(^-|-$)', '')) + '-postgres-user'),
          'password': kb_postgres_user_passwords_processed[user_index].password
        })
      ] }}
  loop: "{{ kb_postgres_users }}"
  loop_control:
    label: "{{ item.name }}"
    index_var: user_index
  when: kb_postgres_users | length > 0
  no_log: true

- name: Get PostgreSQL superuser password
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ kb_postgres_superuser_secret_name }}"
    namespace: "{{ kb_postgres_namespace }}"
  register: kb_postgres_superuser_secret
  until: kb_postgres_superuser_secret.resources | length > 0
  retries: 10
  delay: 5
  when: kb_postgres_users | length > 0
  no_log: true

- name: Set PostgreSQL superuser password fact
  ansible.builtin.set_fact:
    kb_postgres_superuser_password: "{{ kb_postgres_superuser_secret.resources[0].data[kb_postgres_superuser_secret_key] | b64decode }}"
  when: kb_postgres_users | length > 0
  no_log: true

- name: Set PostgreSQL password file content fact
  ansible.builtin.set_fact:
    kb_postgres_pgpass_b64: "{{ ('*:*:*:postgres:' + (kb_postgres_superuser_password | replace('\n', ''))) | b64encode }}"
  when: kb_postgres_users | length > 0
  no_log: true

- name: Get PostgreSQL primary pod
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ kb_postgres_namespace }}"
    label_selectors:
      - "app.kubernetes.io/instance={{ kb_postgres_cluster_name }}"
      - "apps.kubeblocks.io/component-name=postgresql"
      - "kubeblocks.io/role=primary"
  register: kb_postgres_primary_pod_info
  until: kb_postgres_primary_pod_info.resources | length > 0
  retries: 10
  delay: 5
  when: kb_postgres_users | length > 0

- name: Set PostgreSQL primary pod fact
  ansible.builtin.set_fact:
    kb_postgres_primary_pod: "{{ kb_postgres_primary_pod_info.resources[0].metadata.name }}"
  when: kb_postgres_users | length > 0

- name: Configure PostgreSQL databases and users
  block:
    - name: Write PostgreSQL password file to pod
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_postgres_namespace }}"
        pod: "{{ kb_postgres_primary_pod }}"
        container: "{{ kb_postgres_container_name }}"
        command: "sh -c 'echo {{ kb_postgres_pgpass_b64 }} | base64 -d > /tmp/.pgpass && chmod 600 /tmp/.pgpass && echo wrote-pgpass'"
      no_log: true

    - name: Validate PostgreSQL database privileges
      ansible.builtin.assert:
        that:
          - >-
            (
              (db.privileges | default('ALL PRIVILEGES') | upper | regex_replace('\\s+', ' ') | split(',') | map('trim') | list)
              | difference(kb_postgres_allowed_database_privileges)
              | length
            ) == 0
        fail_msg: "Invalid PostgreSQL privileges for user '{{ user.name }}' on database '{{ db.name }}'."
      vars:
        user: "{{ item.0 }}"
        db: "{{ item.1 }}"
        kb_postgres_allowed_database_privileges:
          - ALL
          - ALL PRIVILEGES
          - CONNECT
          - CREATE
          - DELETE
          - INSERT
          - REFERENCES
          - SELECT
          - TEMP
          - TEMPORARY
          - TRIGGER
          - TRUNCATE
          - UPDATE
          - USAGE
      loop: "{{ kb_postgres_users_processed | subelements('databases', skip_missing=True) }}"
      loop_control:
        label: "{{ user.name }}:{{ db.name }}"
      no_log: true

    - name: Build PostgreSQL SQL scripts
      ansible.builtin.set_fact:
        kb_postgres_sql_scripts: >-
          {{ kb_postgres_sql_scripts | default({}) | combine({
            item.name: sql_content | b64encode
          }) }}
      vars:
        sql_content: |
          {% for db in item.databases | default([]) -%}
          SELECT 'CREATE DATABASE "{{ db.name | replace('"', '""') }}"' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ db.name | replace("'", "''") }}')\gexec
          {% endfor -%}
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ item.name | replace("'", "''") }}') THEN
              CREATE ROLE "{{ item.name | replace('"', '""') }}" LOGIN PASSWORD '{{ item.password | replace("'", "''") }}';
            ELSE
              ALTER ROLE "{{ item.name | replace('"', '""') }}" LOGIN PASSWORD '{{ item.password | replace("'", "''") }}';
            END IF;
          END
          $$;
          {% for db in item.databases | default([]) -%}
          ALTER DATABASE "{{ db.name | replace('"', '""') }}" OWNER TO "{{ item.name | replace('"', '""') }}";
          GRANT {{ db.privileges | default('ALL PRIVILEGES') | upper | regex_replace('\\s+', ' ') }} ON DATABASE "{{ db.name | replace('"', '""') }}" TO "{{ item.name | replace('"', '""') }}";
          \connect "{{ db.name | replace('"', '""') }}"
          GRANT ALL ON SCHEMA public TO "{{ item.name | replace('"', '""') }}";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO "{{ item.name | replace('"', '""') }}";
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO "{{ item.name | replace('"', '""') }}";
          {% endfor -%}
      loop: "{{ kb_postgres_users_processed }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Write PostgreSQL SQL setup script to pod
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_postgres_namespace }}"
        pod: "{{ kb_postgres_primary_pod }}"
        container: "{{ kb_postgres_container_name }}"
        command: "sh -c 'echo {{ kb_postgres_sql_scripts[item.name] }} | base64 -d > /tmp/setup_{{ user_index }}.sql && echo wrote-setup-sql'"
      loop: "{{ kb_postgres_users_processed }}"
      loop_control:
        label: "{{ item.name }}"
        index_var: user_index
      no_log: true

    - name: Execute PostgreSQL SQL setup script
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_postgres_namespace }}"
        pod: "{{ kb_postgres_primary_pod }}"
        container: "{{ kb_postgres_container_name }}"
        command: "sh -c 'PGPASSFILE=/tmp/.pgpass psql -h {{ kb_postgres_cluster_name }}-postgresql-postgresql -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/setup_{{ user_index }}.sql && echo executed-setup-sql'"
      loop: "{{ kb_postgres_users_processed }}"
      loop_control:
        label: "{{ item.name }}"
        index_var: user_index
      no_log: true
  always:
    - name: Clean up PostgreSQL SQL setup script
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_postgres_namespace }}"
        pod: "{{ kb_postgres_primary_pod }}"
        container: "{{ kb_postgres_container_name }}"
        command: "sh -c 'rm -f /tmp/setup_{{ user_index }}.sql && echo cleaned-setup-sql'"
      loop: "{{ kb_postgres_users_processed }}"
      loop_control:
        label: "{{ item.name }}"
        index_var: user_index
      no_log: true

    - name: Clean up PostgreSQL password file
      kubernetes.core.k8s_exec:
        namespace: "{{ kb_postgres_namespace }}"
        pod: "{{ kb_postgres_primary_pod }}"
        container: "{{ kb_postgres_container_name }}"
        command: "sh -c 'rm -f /tmp/.pgpass && echo cleaned-pgpass'"
      no_log: true
  when: kb_postgres_users | length > 0
