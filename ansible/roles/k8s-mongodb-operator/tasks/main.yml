---
- name: "Create k8s namespace: {{ namespace_name }}"
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ namespace_name }}"
    state: present

- name: "Add the operator charts repo"
  kubernetes.core.helm_repository:
    name: "mongodb"
    repo_url: "https://mongodb.github.io/helm-charts"

- name: "Update Helm cache"
  kubernetes.core.helm:
    name: "dummy"
    namespace: "kube-system"
    state: "absent"
    update_repo_cache: true

- name: "Install the operator"
  kubernetes.core.helm:
    chart_ref: "mongodb/community-operator"
    name: "mongodb-operator"
    namespace: "{{ namespace_name }}"
    chart_version: "{{ mongo_operator_chart_version }}"
    state: present
    values:
      operator:
        watchNamespace: "*"
