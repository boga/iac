---
- name: Spin up compose project
  community.docker.docker_compose_v2:
    project_name: "{{ docker_compose_project_name }}"
    state: present
    definition:
      services:
        actual-budget:
          image: "{{ image }}"
          ports:
            - "{{ node_port }}:{{ http_port }}"
          environment:
            ACTUAL_PORT: "{{ http_port }}"
          labels:
            tsdproxy.enable: "true"
            tsdproxy.name: "actual-budget"
            tsdproxy.ephemeral: "true"
          volumes:
            - "{{ actual_budget_dir }}/data:/data"
          restart: unless-stopped
          healthcheck:
            test: [ 'CMD-SHELL', 'node src/scripts/health-check.js' ]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 20s
