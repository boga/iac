---
- name: Install Immich
  hosts: localhost
  gather_facts: false

  vars:
    immich_release_name: immich
    immich_namespace: immich
    immich_library_pvc_name: immich-library
    immich_library_storage_size: 15Gi
    immich_storage_class: nfs-unraid
    immich_chart_version: 0.10.3
    immich_db_hostname: immich-database-rw
    immich_db_port: 5432
    immich_db_username: immich
    immich_db_name: immich
    immich_db_secret_name: immich-postgres-credentials
    immich_postgres_cluster_name: immich-database
    immich_postgres_storage_size: 1Gi
    cnpg_release_name: cloudnative-pg
    cnpg_namespace: cnpg-system
    cnpg_chart_version: 0.27.0

  tasks:
    - name: Create Immich namespace
      kubernetes.core.k8s:
        name: "{{ immich_namespace }}"
        api_version: v1
        kind: Namespace
        state: present

    - name: Create Immich library PVC
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ immich_library_pvc_name }}"
            namespace: "{{ immich_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "{{ immich_library_storage_size }}"
            storageClassName: "{{ immich_storage_class }}"

    - name: Create Immich Postgres cluster
      ansible.builtin.include_role:
        name: k8s-cloudnative-postgres-cluster
      vars:
        namespace_name: "{{ immich_namespace }}"
        cnpg_cluster_name: "{{ immich_postgres_cluster_name }}"
        cnpg_instances: 1
        cnpg_storage_size: "{{ immich_postgres_storage_size }}"
        cnpg_storage_class: "{{ immich_storage_class }}"
        cnpg_image_name: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
        cnpg_bootstrap_initdb: true
        cnpg_bootstrap_database: "{{ immich_db_name }}"
        cnpg_bootstrap_owner: "{{ immich_db_username }}"
        cnpg_db_secret_name: "{{ immich_db_secret_name }}"
        cnpg_db_username: "{{ immich_db_username }}"
        cnpg_db_password: "{{ immich_db_password }}"
        cnpg_postgresql_shared_preload_libraries:
          - vchord.so
        cnpg_post_init_application_sql:
          - CREATE EXTENSION vchord CASCADE;
          - CREATE EXTENSION earthdistance CASCADE;

    - name: Add Immich chart repo
      kubernetes.core.helm_repository:
        name: immich
        repo_url: "https://immich-app.github.io/immich-charts"

    - name: Install Immich chart
      kubernetes.core.helm:
        chart_ref: immich/immich
        name: "{{ immich_release_name }}"
        namespace: "{{ immich_namespace }}"
        create_namespace: true
        chart_version: "{{ immich_chart_version }}"
        values:
          controllers:
            main:
              containers:
                main:
                  env:
                    DB_HOSTNAME: "{{ immich_db_hostname }}"
                    DB_PORT: "{{ immich_db_port }}"
                    DB_USERNAME: "{{ immich_db_username }}"
                    DB_PASSWORD:
                      valueFrom:
                        secretKeyRef:
                          name: "{{ immich_db_secret_name }}"
                          key: password
                    DB_DATABASE_NAME: "{{ immich_db_name }}"
          immich:
            persistence:
              library:
                existingClaim: "{{ immich_library_pvc_name }}"
          valkey:
            enabled: true
            persistence:
              data:
                size: 1Gi
                storageClass: "{{ immich_storage_class }}"
          machine-learning:
            persistence:
              cache:
                size: 2Gi
                storageClass: "{{ immich_storage_class }}"
        wait: true
        state: present
      register: immich_install_result
      # To overcome the issue with "helm --all" in kubernetes.core.helm:
      retries: 3
      delay: 10
      until: immich_install_result is succeeded
