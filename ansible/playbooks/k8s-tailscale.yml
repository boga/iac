---
- name: Install Tailscale operator
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    tailscale_operator_namespace: "tailscale"
    tailscale_operator_repo: "https://pkgs.tailscale.com/helmcharts"
    tailscale_operator_chart: "tailscale-operator"
    tailscale_operator_chart_version: "1.98.4"
  tasks:
    - name: Add Tailscale Helm repository
      kubernetes.core.helm_repository:
        name: tailscale
        repo_url: "{{ tailscale_operator_repo }}"

    - name: Install Tailscale operator via Helm
      kubernetes.core.helm:
        name: tailscale-operator
        chart_ref: "tailscale/{{ tailscale_operator_chart }}"
        chart_version: "{{ tailscale_operator_chart_version }}"
        release_namespace: "{{ tailscale_operator_namespace }}"
        create_namespace: true
        values:
          oauth:
            clientId: "{{ k8s_tailscale_operator_client_id }}"
            clientSecret: "{{ k8s_tailscale_operator_client_secret }}"

    - name: Wait for Tailscale operator deployment
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: operator
        namespace: "{{ tailscale_operator_namespace }}"
        wait: true
        wait_timeout: 180
