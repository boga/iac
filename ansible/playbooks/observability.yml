---
- name: Install observability
  hosts: localhost
  gather_facts: false

  vars:
    k8s_namespace_name: o11y
    observability_storage_class: local-path
    observability_grafana_chart_version: "10.5.15"
    observability_victoria_metrics_chart_version: "0.45.0"
    observability_victoria_metrics_alert_chart_version: "0.47.0"
    observability_kube_state_metrics_chart_version: "8.4.1"
    observability_victoria_logs_chart_version: "0.13.9"
    observability_victoria_logs_collector_chart_version: "0.3.7"
    observability_metrics_server_chart_version: "3.12.2"

  roles:
    - role: k8s-create-namespace
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        namespace_labels:
          # Logs collector needs hostPath/hostPort; PSA must allow privileged pods.
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

    - role: k8s-victoria-metrics
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        victoria_metrics_storage_class: "{{ observability_storage_class }}"
        victoria_metrics_chart_version: "{{ observability_victoria_metrics_chart_version }}"
        victoria_metrics_alert_chart_version: "{{ observability_victoria_metrics_alert_chart_version }}"
        kube_state_metrics_chart_version: "{{ observability_kube_state_metrics_chart_version }}"

    - role: k8s-victoria-logs
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        victoria_logs_storage_class: "{{ observability_storage_class }}"
        victoria_logs_chart_version: "{{ observability_victoria_logs_chart_version }}"
        victoria_logs_storage_size: "16Gi"

    - role: k8s-victoria-logs-collector
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        victoria_logs_collector_chart_version: "{{ observability_victoria_logs_collector_chart_version }}"

    - role: k8s-grafana
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        grafana_storage_class: "{{ observability_storage_class }}"
        grafana_chart_version: "{{ observability_grafana_chart_version }}"

    - role: k8s-metrics-server
      vars:
        metrics_server_chart_version: "{{ observability_metrics_server_chart_version }}"
