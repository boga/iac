---
- name: Install observability
  hosts: localhost
  gather_facts: false

  vars:
    k8s_namespace_name: o11y

  roles:
    - role: k8s-create-namespace
      vars:
        namespace_name: "{{ k8s_namespace_name }}"

    - role: k8s-grafana
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        grafana_chart_version: "10.5.5"

    - role: k8s-victoria-metrics
      vars:
        namespace_name: "{{ k8s_namespace_name }}"

    - role: k8s-victoria-logs
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        victoria_logs_chart_version: "0.11.24"
        victoria_logs_storage_size: "16Gi"
