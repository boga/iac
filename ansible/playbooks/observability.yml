---
- name: Install observability
  hosts: localhost
  gather_facts: false

  vars:
    k8s_namespace_name: o11y
    observability_storage_class: local-path
    observability_grafana_chart_version: "10.5.15"
    observability_victoria_metrics_chart_version: "0.45.0"
    observability_victoria_metrics_alert_chart_version: "0.47.0"
    observability_kube_state_metrics_chart_version: "8.4.1"
    observability_victoria_logs_chart_version: "0.13.9"
    observability_victoria_logs_collector_chart_version: "0.3.7"
    observability_metrics_server_version: "v0.8.0"
    observability_metrics_server_manifest_url: >-
      https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ observability_metrics_server_version }}/components.yaml
    observability_metrics_server_kubelet_flags:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,Hostname,InternalDNS,ExternalDNS,ExternalIP

  roles:
    - role: k8s-create-namespace
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        namespace_labels:
          # Logs collector needs hostPath/hostPort; PSA must allow privileged pods.
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged

    - role: k8s-victoria-metrics
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        victoria_metrics_storage_class: "{{ observability_storage_class }}"
        victoria_metrics_chart_version: "{{ observability_victoria_metrics_chart_version }}"
        victoria_metrics_alert_chart_version: "{{ observability_victoria_metrics_alert_chart_version }}"
        kube_state_metrics_chart_version: "{{ observability_kube_state_metrics_chart_version }}"

    - role: k8s-victoria-logs
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        victoria_logs_storage_class: "{{ observability_storage_class }}"
        victoria_logs_chart_version: "{{ observability_victoria_logs_chart_version }}"
        victoria_logs_storage_size: "16Gi"

    - role: k8s-victoria-logs-collector
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        victoria_logs_collector_chart_version: "{{ observability_victoria_logs_collector_chart_version }}"

    - role: k8s-grafana
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        grafana_storage_class: "{{ observability_storage_class }}"
        grafana_chart_version: "{{ observability_grafana_chart_version }}"

  tasks:
    - name: Apply metrics-server manifest
      kubernetes.core.k8s:
        state: present
        src: "{{ observability_metrics_server_manifest_url }}"

    - name: Get metrics-server deployment
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: metrics-server
        namespace: kube-system
      register: observability_metrics_server_deployment

    - name: Configure metrics-server for Talos
      kubernetes.core.k8s_json_patch:
        api_version: apps/v1
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        patch:
          - op: replace
            path: /spec/template/spec/containers/0/args
            value: >-
              {{
                observability_metrics_server_deployment.resources[0].spec.template.spec.containers[0].args
                + (
                  observability_metrics_server_kubelet_flags
                  | reject(
                      'in',
                      observability_metrics_server_deployment.resources[0].spec.template.spec.containers[0].args
                    )
                  | list
                )
              }}

    - name: Wait for metrics-server deployment
      kubernetes.core.k8s:
        api_version: apps/v1
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        wait: true
        wait_timeout: 180
