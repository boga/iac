---
- name: Install SigNoz stack into Talos-backed Kubernetes
  hosts: localhost
  gather_facts: false

  vars:
    k8s_namespace_name: o11y
    signoz_cluster_name: talos-home
    signoz_otlp_tailscale_hostname: signoz-otel-collector
    signoz_otlp_grpc_port: 4317
    signoz_otlp_http_port: 4318
    signoz_clickhouse_storage_class: nfs-unraid

  roles:
    - role: helm-repo
      vars:
        repo_name: "signoz"
        repo_url: "https://charts.signoz.io"
        update_repo_cache: yes

    - role: k8s-signoz
      vars:
        namespace_name: "{{ k8s_namespace_name }}"
        signoz_host_collector_name: "talos-host-collector"
        signoz_clickhouse_size: 20Gi

- name: Deploy SigNoz edge collector on Unraid
  hosts: unraid
  gather_facts: false

  vars:
    signoz_collector_dir: /opt/signoz-collector
    signoz_otlp_tailscale_hostname: signoz-otel-collector
    signoz_otlp_grpc_port: 4317
    signoz_otlp_http_port: 4318
    signoz_otlp_tailscale_fqdn: "{{ signoz_otlp_tailscale_hostname }}.{{ tailscale_tailnet_name }}"
    signoz_otlp_http_endpoint: "http://{{ signoz_otlp_tailscale_fqdn }}:{{ signoz_otlp_http_port }}"
    signoz_otlp_grpc_endpoint: "{{ signoz_otlp_tailscale_fqdn }}:{{ signoz_otlp_grpc_port }}"

  roles:
    - role: signoz-host-collector
      vars:
        collector_base_dir: "{{ signoz_collector_dir }}"
        signoz_otlp_http_endpoint: "{{ signoz_otlp_http_endpoint }}"
        signoz_otlp_grpc_endpoint: "{{ signoz_otlp_grpc_endpoint }}"
