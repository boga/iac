---
- name: Install Paperless-ngx
  hosts: localhost
  gather_facts: false
  vars:
    paperless_name: paperless
    paperless_namespace: paperless
    paperless_image: ghcr.io/paperless-ngx/paperless-ngx:2.18.4
    paperless_replicas: 1
    paperless_port: 8000
    paperless_storage_class: local-path
    paperless_data_storage_size: 1Gi
    paperless_media_storage_size: 10Gi
    paperless_redis_image: redis:7.4-alpine
    paperless_redis_storage_size: 1Gi
    paperless_postgres_cluster_name: paperless-database
    paperless_postgres_storage_size: 2Gi
    paperless_db_name: paperless
    paperless_db_username: paperless
    paperless_db_secret_name: "{{ paperless_postgres_cluster_name }}-{{ paperless_db_username }}-postgres-user"
    paperless_db_hostname: "{{ paperless_postgres_cluster_name }}-postgresql-postgresql"
    paperless_app_secret_name: "{{ paperless_name }}-app"
    paperless_oidc_secret_name: "{{ paperless_name }}-oidc"
    paperless_oidc_client_id: cccclient_id
    paperless_oidc_client_secret: "{{ cccclient_secret }}"
    paperless_oidc_provider_id: tsidp
    paperless_oidc_provider_name: Tailscale
    paperless_oidc_configuration_url: "https://{{ idp_fqdn }}/.well-known/openid-configuration"
    paperless_tailscale_hostname: "papers.{{ tailscale_tailnet_name }}"

  roles:
    - role: k8s-kubeblocks-postgres-cluster
      vars:
        kb_postgres_namespace: "{{ paperless_namespace }}"
        kb_postgres_cluster_name: "{{ paperless_postgres_cluster_name }}"
        kb_postgres_replicas: 1
        kb_postgres_storage: "{{ paperless_postgres_storage_size }}"
        kb_postgres_storage_class: "{{ paperless_storage_class }}"
        kb_postgres_users:
          - name: "{{ paperless_db_username }}"
            secret_name: "{{ paperless_db_secret_name }}"
            databases:
              - name: "{{ paperless_db_name }}"

  tasks:
    # Preserve this key across reruns; changing it invalidates sessions and encrypted data.
    - name: Get existing Paperless application secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ paperless_app_secret_name }}"
        namespace: "{{ paperless_namespace }}"
      register: paperless_app_secret
      no_log: true

    - name: Set Paperless application secret key
      ansible.builtin.set_fact:
        paperless_secret_key: >-
          {{
            (paperless_app_secret.resources[0].data['secret-key'] | b64decode)
            if (
              paperless_app_secret.resources | length > 0
              and paperless_app_secret.resources[0].data is defined
              and paperless_app_secret.resources[0].data['secret-key'] is defined
            )
            else lookup('password', '/dev/null length=64 chars=ascii_letters,digits')
          }}
      no_log: true

    - name: Create Paperless application secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ paperless_app_secret_name }}"
            namespace: "{{ paperless_namespace }}"
          type: Opaque
          stringData:
            secret-key: "{{ paperless_secret_key }}"
      no_log: true

    - name: Create Paperless OIDC secret
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: "{{ paperless_oidc_secret_name }}"
            namespace: "{{ paperless_namespace }}"
          type: Opaque
          stringData:
            socialaccount-providers: >-
              {{ {
                'openid_connect': {
                  'APPS': [{
                    'provider_id': paperless_oidc_provider_id,
                    'name': paperless_oidc_provider_name,
                    'client_id': paperless_oidc_client_id,
                    'secret': paperless_oidc_client_secret,
                    'settings': {
                      'server_url': paperless_oidc_configuration_url
                    }
                  }]
                }
              } | to_json }}
      no_log: true

    - name: Create Paperless persistent volume claims
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ paperless_namespace }}"
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "{{ item.size }}"
            storageClassName: "{{ paperless_storage_class }}"
      loop:
        - name: "{{ paperless_name }}-data"
          size: "{{ paperless_data_storage_size }}"
        - name: "{{ paperless_name }}-media"
          size: "{{ paperless_media_storage_size }}"
        - name: "{{ paperless_name }}-redis"
          size: "{{ paperless_redis_storage_size }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy Paperless Redis
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ paperless_name }}-redis"
            namespace: "{{ paperless_namespace }}"
            labels:
              app.kubernetes.io/name: "{{ paperless_name }}-redis"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app.kubernetes.io/name: "{{ paperless_name }}-redis"
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: "{{ paperless_name }}-redis"
              spec:
                containers:
                  - name: redis
                    image: "{{ paperless_redis_image }}"
                    args:
                      - redis-server
                      - --appendonly
                      - "yes"
                    ports:
                      - name: redis
                        containerPort: 6379
                        protocol: TCP
                    resources:
                      requests:
                        cpu: 50m
                        memory: 64Mi
                      limits:
                        memory: 256Mi
                    volumeMounts:
                      - name: data
                        mountPath: /data
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: "{{ paperless_name }}-redis"

    - name: Create Paperless Redis service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ paperless_name }}-redis"
            namespace: "{{ paperless_namespace }}"
          spec:
            type: ClusterIP
            selector:
              app.kubernetes.io/name: "{{ paperless_name }}-redis"
            ports:
              - name: redis
                port: 6379
                targetPort: redis

    - name: Deploy Paperless-ngx
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ paperless_name }}"
            namespace: "{{ paperless_namespace }}"
            labels:
              app.kubernetes.io/name: "{{ paperless_name }}"
          spec:
            replicas: "{{ paperless_replicas }}"
            revisionHistoryLimit: 3
            selector:
              matchLabels:
                app.kubernetes.io/name: "{{ paperless_name }}"
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: "{{ paperless_name }}"
              spec:
                containers:
                  - name: "{{ paperless_name }}"
                    image: "{{ paperless_image }}"
                    imagePullPolicy: IfNotPresent
                    env:
                      - name: PAPERLESS_DBENGINE
                        value: postgresql
                      - name: PAPERLESS_DBHOST
                        value: "{{ paperless_db_hostname }}"
                      - name: PAPERLESS_DBNAME
                        value: "{{ paperless_db_name }}"
                      - name: PAPERLESS_DBUSER
                        value: "{{ paperless_db_username }}"
                      - name: PAPERLESS_DBPASS
                        valueFrom:
                          secretKeyRef:
                            name: "{{ paperless_db_secret_name }}"
                            key: password
                      - name: PAPERLESS_REDIS
                        value: "redis://{{ paperless_name }}-redis:6379"
                      - name: PAPERLESS_SECRET_KEY
                        valueFrom:
                          secretKeyRef:
                            name: "{{ paperless_app_secret_name }}"
                            key: secret-key
                      - name: PAPERLESS_URL
                        value: "https://{{ paperless_tailscale_hostname }}"
                      - name: PAPERLESS_APPS
                        value: allauth.socialaccount.providers.openid_connect
                      - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
                        valueFrom:
                          secretKeyRef:
                            name: "{{ paperless_oidc_secret_name }}"
                            key: socialaccount-providers
                    ports:
                      - name: http
                        containerPort: "{{ paperless_port }}"
                        protocol: TCP
                    startupProbe:
                      httpGet:
                        path: /
                        port: http
                      initialDelaySeconds: 10
                      periodSeconds: 5
                      failureThreshold: 30
                    readinessProbe:
                      httpGet:
                        path: /
                        port: http
                      periodSeconds: 10
                      timeoutSeconds: 3
                    livenessProbe:
                      httpGet:
                        path: /
                        port: http
                      initialDelaySeconds: 30
                      periodSeconds: 15
                      timeoutSeconds: 5
                    resources:
                      requests:
                        cpu: 100m
                        memory: 512Mi
                      limits:
                        memory: 2Gi
                    volumeMounts:
                      - name: data
                        mountPath: /usr/src/paperless/data
                      - name: media
                        mountPath: /usr/src/paperless/media
                volumes:
                  - name: data
                    persistentVolumeClaim:
                      claimName: "{{ paperless_name }}-data"
                  - name: media
                    persistentVolumeClaim:
                      claimName: "{{ paperless_name }}-media"

    - name: Create Paperless service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ paperless_name }}"
            namespace: "{{ paperless_namespace }}"
            labels:
              app.kubernetes.io/name: "{{ paperless_name }}"
          spec:
            type: ClusterIP
            selector:
              app.kubernetes.io/name: "{{ paperless_name }}"
            ports:
              - name: http
                port: "{{ paperless_port }}"
                targetPort: http

    - name: Create Tailscale Ingress for Paperless
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: "{{ paperless_name }}-tailscale"
            namespace: "{{ paperless_namespace }}"
            labels:
              app.kubernetes.io/name: "{{ paperless_name }}"
            annotations:
              gethomepage.dev/description: Document management
              gethomepage.dev/enabled: "true"
              gethomepage.dev/group: Apps
              gethomepage.dev/icon: paperless-ngx.png
              gethomepage.dev/name: Paperless
              gethomepage.dev/pod-selector: "app.kubernetes.io/name={{ paperless_name }}"
          spec:
            ingressClassName: tailscale
            tls:
              - hosts:
                  - "{{ paperless_tailscale_hostname }}"
            rules:
              - host: "{{ paperless_tailscale_hostname }}"
                http:
                  paths:
                    - path: /
                      pathType: Prefix
                      backend:
                        service:
                          name: "{{ paperless_name }}"
                          port:
                            name: http
