---
- name: Install NFS CSI driver
  hosts: localhost
  gather_facts: false

  roles:
    - role: k8s-nfs-csi
      vars:
        namespace_name: nfs-csi
        nfs_csi_chart_version: "4.12.1"
        nfs_csi_server: 192.168.88.178
        nfs_csi_share: /mnt/user/k8s-nfs-csi
        nfs_csi_storage_class_name: nfs-csi-unraid
