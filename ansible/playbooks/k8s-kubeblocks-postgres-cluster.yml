---
- name: Create KubeBlocks PostgreSQL debug cluster
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core

  roles:
    - role: k8s-kubeblocks-postgres-cluster
      vars:
        kb_postgres_namespace: kubeblocks-postgres-debug
        kb_postgres_cluster_name: postgres-debug-cluster
        kb_postgres_mode: standalone
        kb_postgres_replicas: 1
        kb_postgres_storage: 2Gi
