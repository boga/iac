---
- name: Installs Little
  hosts: little
  gather_facts: false
  become: true
  vars:
    HOME_ASSISTANT_IMAGE_TAG: "2024.12"

  roles:
    - role: provision
    - role: docker
    - role: home-assistant
    - role: adguard-home
      vars:
        image_tag: v0.107.54 # Nov 6th 2024
        http_port: 3000
        root_dir: /mnt/adguard-home
