---
- name: Installs Little
  hosts: little
  gather_facts: false
  become: true

  roles:
    - role: provision
    - role: docker
    - role: home-assistant
      vars:
        home_assistant_image_tag: "2024.12"
        home_assistant_root_dir: /mnt/home-assistant
    - role: adguard-home
      vars:
        image_tag: v0.107.54 # Nov 6th 2024
        http_port: 3000
        root_dir: /mnt/adguard-home
