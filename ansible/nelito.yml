- name: Nelito services
  hosts: localhost
  gather_facts: false
  vars:
    docker_volumes_dir: /mnt/user/docker-data
    paperless_http_port: 18000
    paperless_docker_volume_dir: "{{ docker_volumes_dir }}/paperless-ngx"
    portainer_http_port: 18001
    portainer_docker_volume_dir: "{{ docker_volumes_dir }}/portainer"
  environment:
    DOCKER_HOST: "ssh://root@nelito"

  tasks:
    - name: Paperless-ngx
      community.docker.docker_compose_v2:
        project_name: paperless-ngx
        state: present
        definition:
          services:
            broker:
              image: docker.io/library/redis:7
              restart: unless-stopped
              volumes:
                - "{{ paperless_docker_volume_dir }}/redis/data:/data"

            db:
              image: docker.io/library/postgres:17
              restart: unless-stopped
              volumes:
                - "{{ paperless_docker_volume_dir }}/postgres/data:/var/lib/postgresql/data"
              environment:
                POSTGRES_DB: paperless
                POSTGRES_USER: paperless
                POSTGRES_PASSWORD: paperless

            webserver:
              image: ghcr.io/paperless-ngx/paperless-ngx:latest
              restart: unless-stopped
              depends_on:
                - db
                - broker
                - gotenberg
                - tika
              ports:
                - "{{ paperless_http_port }}:8000"
              volumes:
                - "{{ paperless_docker_volume_dir }}/paperless/data:/usr/src/paperless/data"
                - "{{ paperless_docker_volume_dir }}/paperless/media:/usr/src/paperless/media"
                - "{{ paperless_docker_volume_dir }}/paperless/export:/usr/src/paperless/export"
                - "{{ paperless_docker_volume_dir }}/paperless/consume:/usr/src/paperless/consume"
              environment:
                PAPERLESS_REDIS: redis://broker:6379
                PAPERLESS_DBHOST: db
                PAPERLESS_TIKA_ENABLED: 1
                PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
                PAPERLESS_TIKA_ENDPOINT: http://tika:9998
                ###############################################################################
                # Paperless-ngx settings                                                      #
                ###############################################################################

                # See http://docs.paperless-ngx.com/configuration/ for all available options.

                # The UID and GID of the user used to run paperless in the container. Set this
                # to your UID and GID on the host so that you have write access to the
                # consumption directory.
                #USERMAP_UID: 1000
                #USERMAP_GID: 1000

                # See the documentation linked above for all options. A few commonly adjusted settings
                # are provided below.

                # This is required if you will be exposing Paperless-ngx on a public domain
                # (if doing so please consider security measures such as reverse proxy)
                #PAPERLESS_URL: https://paperless.example.com

                # Adjust this key if you plan to make paperless available publicly. It should
                # be a very long sequence of random characters. You don't need to remember it.
                #PAPERLESS_SECRET_KEY: change-me

                # Use this variable to set a timezone for the Paperless Docker containers. Defaults to UTC.
                PAPERLESS_TIME_ZONE: Europe/Amsterdam

                # The default language to use for OCR. Set this to the language most of your
                # documents are written in.
                #PAPERLESS_OCR_LANGUAGE: eng

                # Additional languages to install for text recognition, separated by a whitespace.
                # Note that this is different from PAPERLESS_OCR_LANGUAGE (default=eng), which defines
                # the language used for OCR.
                # The container installs English, German, Italian, Spanish and French by default.
                # See https://packages.debian.org/search?keywords=tesseract-ocr-&searchon=names&suite=buster
                # for available languages.
                PAPERLESS_OCR_LANGUAGES: nld eng rus

            gotenberg:
              image: docker.io/gotenberg/gotenberg:8.19
              restart: unless-stopped
              # The gotenberg chromium route is used to convert .eml files. We do not
              # want to allow external content like tracking pixels or even javascript.
              command:
                - "gotenberg"
                - "--chromium-disable-javascript=true"
                - "--chromium-allow-list=file:///tmp/.*"

            tika:
              image: docker.io/apache/tika:latest
              restart: unless-stopped

    - name: Portainer
      community.docker.docker_compose_v2:
        project_name: portainer
        state: present
        definition:
          services:
            portainer:
              image: portainer/portainer-ce@sha256:449202d765d28ec443c1657fc1121aff92b8afcee6b58bcea36e1f0e81e8297c
              ports:
                # exposes the Portainer UI securely over HTTPS on port 9443.
                - "{{ portainer_http_port }}:9443"
                # exposes the port for optional Edge compute features.
                # - 8000:8000
              volumes:
                - "{{ portainer_docker_volume_dir }}/data:/data"
                - "/var/run/docker.sock:/var/run/docker.sock"
              restart: unless-stopped
