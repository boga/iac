---
- name: Run using a project directory
  hosts: looner
  gather_facts: no
  vars:
    remote_project_dir: "/mnt/prometheus"
  tasks:
    - name: install pip3
      become: true
      apt: 
        name: python3-pip
        state: present 

    - name: install docker python package
      pip:
        name: 
          - docker
          - docker-compose
        state: present
    
    - name: create a directory for project files
      become: true
      ansible.builtin.file:
        path: "{{ remote_project_dir }}"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user }}"

    - name: copy project files
      become: true
      copy:
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "{{ remote_project_dir }}/{{ item }}"
        mode: 0600
      loop:
      - docker-compose.yml
      - prometheus.yml
      - alert.yml

    - name: create and start services
      community.docker.docker_compose:
        project_name: prometheus
        project_src: "{{ remote_project_dir }}"
        debug: true
      register: output

    - name: print docker-compose output
      ansible.builtin.debug:
        var: output
        verbosity: 2