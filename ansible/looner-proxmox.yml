- name: Preliminary tasks
  hosts: looner-proxmox
  gather_facts: false
  become: true

  tasks:
    - name: Mount HDDs
      ansible.posix.mount:
        path: "{{ item.dir }}"
        src: "UUID={{ item.uuid }}"
        fstype: "{{ item.fs }}"
        opts: defaults
        state: mounted
      loop:
        # /dev/sdb1: UUID="2235e805-43a8-4bec-b564-f20c589c7d32" BLOCK_SIZE="4096" TYPE="ext4" PARTUUID="73f8f526-e3ae-9649-a068-3ebd3153567a"
        - { dir: "/mnt/hdd-slow/", fs: "ext4", uuid: "2235e805-43a8-4bec-b564-f20c589c7d32" }
        # /dev/sdc1: UUID="a6264bb7-0b53-4db5-8bf8-b7d84a767b33" BLOCK_SIZE="4096" TYPE="ext4" PARTUUID="5b4707f5-01"
        - { dir: "/mnt/hdd-fast/", fs: "ext4", uuid: "a6264bb7-0b53-4db5-8bf8-b7d84a767b33" }

- name: Installs Looner
  hosts: looner-proxmox
  gather_facts: true
  become: true

  roles:
    - role: provision
    - role: artis3n.tailscale
      vars:
        # accept-dns=false because of https://tailscale.com/kb/1133/proxmox#resolvconf-within-lxc
        tailscale_args: "--ssh --accept-dns=false"
        tailscale_authkey: "{{ tailscale_oauthkey }}"
        tailscale_tags:
          - "server"
        tailscale_oauth_ephemeral: false
        tailscale_oauth_preauthorized: false
    - role: geerlingguy.nfs
      vars:
        nfs_rpcbind_state: started
        nfs_rpcbind_enabled: true
        nfs_exports: [
          "/mnt/hdd-fast/Audio    *(rw,sync,no_root_squash,no_subtree_check,insecure)",
          "/mnt/hdd-fast/Image    *(rw,sync,no_root_squash,no_subtree_check,insecure)",
          "/mnt/hdd-fast/k8s-data *(rw,sync,no_root_squash,no_subtree_check,insecure)",
        ]
    - role: geerlingguy.pip
      vars:
        pip_install_packages:
          - name: docker
    - role: geerlingguy.docker
    - role: samba
      vars:
        samba_mount_point: /mnt/hdd-fast
        samba_share: /mnt/hdd-fast;/mnt/hdd-fast
