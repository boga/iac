---
- name: Create Talos Linux VM on Proxmox
  hosts: looner
  gather_facts: false

  roles:
    - name: "Create Talos Linux VM from image"
      role: proxmox-vm
      vars:
        proxmox_vm_id: 300
        proxmox_vm_name: "looner-talos"
        proxmox_vm_tags:
          - "talos"
          - "k8s"
        proxmox_vm_cores: 4
        proxmox_vm_memory: 10000
        proxmox_vm_disk_size: 40G
        proxmox_vm_image_url: "https://factory.talos.dev/image/7d4c31cbd96db9f90c874990697c523482b2bae27fb4631d5583dcd9c281b1ff/v1.13.2/nocloud-amd64.raw.xz"
        proxmox_vm_image_file: "talos-v1.13.2-nocloud-amd64-7d4c31cbd96db9f90c874990697c523482b2bae27fb4631d5583dcd9c281b1ff.raw"
        proxmox_vm_agent: "enabled=1"
        proxmox_vm_cloud_init_enabled: false
        proxmox_vm_bios: "ovmf"
        proxmox_vm_machine: "q35"
        proxmox_vm_efidisk:
          storage: "{{ proxmox_vm_storage }}"
          format: "raw"
          efitype: "4m"
          pre_enrolled_keys: false
