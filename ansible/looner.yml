---
- name: Installs Looner
  hosts: looner
  gather_facts: true
  become: true

  roles:
    - role: provision
    - role: geerlingguy.nfs
      vars:
        nfs_rpcbind_state: started
        nfs_rpcbind_enabled: true
        nfs_exports: [
          "/mnt/hdd-fast/Audio    *(rw,sync,no_root_squash,no_subtree_check,insecure)",
          "/mnt/hdd-fast/Image    *(rw,sync,no_root_squash,no_subtree_check,insecure)",
          "/mnt/hdd-fast/k8s-data *(rw,sync,no_root_squash,no_subtree_check,insecure)",
        ]
    - role: samba
