---
- name: "Setup looner k8s cluster"
  hosts: looner
  gather_facts: false

  roles:
    - role: k8s-local-path-provisioner
      vars:
        local_path_provisioner_default_paths:
          - /var/local/storage

    - role: k8s-create-namespace
      vars:
        namespace_name: kubeblocks

    - role: k8s-kubeblocks
