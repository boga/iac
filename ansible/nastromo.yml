---
- name: Install NFS CSI driver
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Apply NFS CSI driver manifest
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        apply -f https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/v4.6.0/deploy/install-driver.yaml
      changed_when: true

    - name: Wait for nfs-csi pods
      ansible.builtin.command: >
        kubectl --kubeconfig {{ kubeconfig_path }}
        -n kube-system rollout status deployment/csi-nfs-controller --timeout=180s
      changed_when: false