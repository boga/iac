---
- ansible.builtin.import_playbook: "playbooks/k8s-nfs-csi/main.yml"

- name: Install metrics-server
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    kubeconfig_path: "./kubeconfig"
    metrics_server_version: "v0.8.0"
    metrics_server_manifest_url: "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml"
    metrics_server_kubelet_flags:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,Hostname,InternalDNS,ExternalDNS,ExternalIP

  tasks:
    - name: Apply metrics-server manifest
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ metrics_server_manifest_url }}"

    - name: Patch metrics-server args for Talos
      kubernetes.core.k8s_json_patch:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        patch:
          - op: add
            path: "/spec/template/spec/containers/0/args/-"
            value: "{{ item }}"
      loop: "{{ metrics_server_kubelet_flags }}"

    - name: Wait for metrics-server deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        wait: true
        wait_timeout: 180

- name: Install Tailscale operator
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    kubeconfig_path: "./kubeconfig"
    tailscale_operator_namespace: "tailscale"
    tailscale_operator_repo: "https://pkgs.tailscale.com/helmcharts"
    tailscale_operator_chart: "tailscale-operator"
    tailscale_operator_chart_version: "1.92.4"
  tasks:
    - name: Add Tailscale Helm repository
      kubernetes.core.helm_repository:
        name: tailscale
        repo_url: "{{ tailscale_operator_repo }}"

    - name: Install Tailscale operator via Helm
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: tailscale-operator
        chart_ref: "tailscale/{{ tailscale_operator_chart }}"
        chart_version: "{{ tailscale_operator_chart_version }}"
        release_namespace: "{{ tailscale_operator_namespace }}"
        create_namespace: true
        values:
          oauth:
            clientId: "{{ tailscale_operator_client_id }}"
            clientSecret: "{{ tailscale_operator_client_secret }}"

    - name: Wait for Tailscale operator deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: operator
        namespace: "{{ tailscale_operator_namespace }}"
        wait: true
        wait_timeout: 180

- ansible.builtin.import_playbook: "playbooks/observability.yml"
- ansible.builtin.import_playbook: "playbooks/immich/main.yml"
- ansible.builtin.import_playbook: "playbooks/homepage.yml"
