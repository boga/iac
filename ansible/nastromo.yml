---
- name: Install NFS CSI driver
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    kubeconfig_path: "./kubeconfig"
    nfs_csi_repo_base: "https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/{{ nfs_csi_version }}/deploy/{{ nfs_csi_version }}"
    nfs_csi_version: "v4.12.1"
    nfs_storageclass_name: "nfs-unraid"
    # StorageClass parameters are immutable; changing unraid_nfs_server or unraid_nfs_share
    # requires deleting and recreating the StorageClass or using a new name.
    unraid_nfs_server: "192.168.88.178"
    unraid_nfs_share: "/mnt/user/k8s-nfs"
  tasks:
    - name: "Apply NFS CSI driver manifests: {{ nfs_csi_version }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ nfs_csi_repo_base }}/{{ item }}"
      loop:
        - rbac-csi-nfs.yaml
        - csi-nfs-driverinfo.yaml
        - csi-nfs-controller.yaml
        - csi-nfs-node.yaml

    - name: Wait for nfs-csi controller deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: csi-nfs-controller
        namespace: kube-system
        wait: true
        wait_timeout: 180

    - name: Wait for nfs-csi node daemonset
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: DaemonSet
        name: csi-nfs-node
        namespace: kube-system
        wait: true
        wait_timeout: 180

    # StorageClass parameters are immutable; changing unraid_nfs_server or unraid_nfs_share
    # requires deleting and recreating the StorageClass or using a new name.
    - name: "Add StorageClass: {{ nfs_storageclass_name }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "{{ nfs_storageclass_name }}"
          provisioner: nfs.csi.k8s.io
          parameters:
            server: "{{ unraid_nfs_server }}"
            share: "{{ unraid_nfs_share }}"
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          mountOptions:
            - nfsvers=4.1

- name: Install metrics-server
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    kubeconfig_path: "./kubeconfig"
    metrics_server_version: "v0.8.0"
    metrics_server_manifest_url: "https://github.com/kubernetes-sigs/metrics-server/releases/download/{{ metrics_server_version }}/components.yaml"
    metrics_server_kubelet_flags:
      - --kubelet-insecure-tls
      - --kubelet-preferred-address-types=InternalIP,Hostname,InternalDNS,ExternalDNS,ExternalIP

  tasks:
    - name: Apply metrics-server manifest
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ metrics_server_manifest_url }}"

    - name: Patch metrics-server args for Talos
      kubernetes.core.k8s_json_patch:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        patch:
          - op: add
            path: "/spec/template/spec/containers/0/args/-"
            value: "{{ item }}"
      loop: "{{ metrics_server_kubelet_flags }}"

    - name: Wait for metrics-server deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: metrics-server
        namespace: kube-system
        wait: true
        wait_timeout: 180

- name: Install Tailscale operator
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    kubeconfig_path: "./kubeconfig"
    tailscale_operator_namespace: "tailscale"
    tailscale_operator_repo: "https://pkgs.tailscale.com/helmcharts"
    tailscale_operator_chart: "tailscale-operator"
    tailscale_operator_chart_version: "1.92.4"
  tasks:
    - name: Add Tailscale Helm repository
      kubernetes.core.helm_repository:
        name: tailscale
        repo_url: "{{ tailscale_operator_repo }}"

    - name: Install Tailscale operator via Helm
      kubernetes.core.helm:
        kubeconfig: "{{ kubeconfig_path }}"
        name: tailscale-operator
        chart_ref: "tailscale/{{ tailscale_operator_chart }}"
        chart_version: "{{ tailscale_operator_chart_version }}"
        release_namespace: "{{ tailscale_operator_namespace }}"
        create_namespace: true
        values:
          oauth:
            clientId: "{{ tailscale_operator_client_id }}"
            clientSecret: "{{ tailscale_operator_client_secret }}"

    - name: Wait for Tailscale operator deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: operator
        namespace: "{{ tailscale_operator_namespace }}"
        wait: true
        wait_timeout: 180

- ansible.builtin.import_playbook: "playbooks/signoz/main.yml"
