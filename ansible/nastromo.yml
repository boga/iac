---
- name: Install NFS CSI driver
  hosts: localhost
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    kubeconfig_path: "./kubeconfig"
    nfs_csi_repo_base: "https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/{{ nfs_csi_version }}/deploy/{{ nfs_csi_version }}"
    nfs_csi_version: "v4.12.1"
    nfs_storageclass_name: "nfs-unraid"
    unraid_nfs_server: "192.168.88.178"
    unraid_nfs_share: "/mnt/user/k8s-nfs"
  tasks:
    - name: "Apply NFS CSI driver manifests: {{ nfs_csi_version }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        src: "{{ nfs_csi_repo_base }}/{{ item }}"
      loop:
        - rbac-csi-nfs.yaml
        - csi-nfs-driverinfo.yaml
        - csi-nfs-controller.yaml
        - csi-nfs-node.yaml

    - name: Wait for nfs-csi controller deployment
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: Deployment
        name: csi-nfs-controller
        namespace: kube-system
        wait: true
        wait_timeout: 180

    - name: Wait for nfs-csi node daemonset
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: apps/v1
        kind: DaemonSet
        name: csi-nfs-node
        namespace: kube-system
        wait: true
        wait_timeout: 180

    - name: "Add StorageClass: {{ nfs_storageclass_name }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: "{{ nfs_storageclass_name }}"
          provisioner: nfs.csi.k8s.io
          parameters:
            server: "{{ unraid_nfs_server }}"
            share: "{{ unraid_nfs_share }}"
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          mountOptions:
            - nfsvers=4.1
