---
# Configure nastromo host bootstrap and file sharing.
- name: Configure nastromo
  hosts: nastromo
  gather_facts: false
  become: true
  vars:
    storage_mount_path: /mnt/storage
    storage_partition_uuid: ee96fe22-9491-4d9d-8e5c-fc83028195a0
    storage_partition_fstype: ext4
    sshd_allow_users:
      - ans
      - miju
    sshd_service_name: ssh
    tailscale_debian_release: trixie
    tailscale_apt_key_url: "https://pkgs.tailscale.com/stable/debian/{{ tailscale_debian_release }}.noarmor.gpg"
    tailscale_apt_repository_url: "https://pkgs.tailscale.com/stable/debian/{{ tailscale_debian_release }}.tailscale-keyring.list"
    samba_shares:
      - name: BogaFiles
        path: "{{ storage_mount_path }}/BogaFiles"
      - name: BogaAudio
        path: "{{ storage_mount_path }}/BogaAudio"
    nfs_exports:
      - path: "{{ storage_mount_path }}/ProxmoxBackups"
        clients: "{{ proxmox_node_ip }}"
        options: "rw,sync,no_subtree_check,no_root_squash"
  tasks:
    # Ensure the dedicated Ansible user exists without configuring a login password.
    - name: Create ans user
      ansible.builtin.user:
        name: ans
        comment: Ansible automation user
        create_home: true
        shell: /bin/bash
        state: present
      tags:
        - bootstrap
        - never

    # Allow the Ansible user to run privileged commands without a sudo password prompt.
    - name: Allow ans user passwordless sudo
      ansible.builtin.copy:
        dest: /etc/sudoers.d/ans
        content: "ans ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      tags:
        - bootstrap
        - never

    # Configure SSHD early so host access policy is explicit before file sharing setup.
    - name: Configure SSHD
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-main.conf
        content: |
          Port 22
          AddressFamily any
          ListenAddress 0.0.0.0
          ListenAddress ::

          PermitRootLogin no
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
          UsePAM yes

          X11Forwarding no
          AllowTcpForwarding no
          AllowAgentForwarding no

          PrintMotd no
          AcceptEnv LANG LC_*

          AllowUsers {{ sshd_allow_users | join(' ') }}
        owner: root
        group: root
        mode: "0644"
      notify: Reload SSH service
      tags:
        - bootstrap
        - never

    # Validate the complete SSH configuration before handlers reload SSH.
    - name: Validate SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      tags:
        - bootstrap
        - never

    # Install Tailscale from the official Debian 13 APT repository.
    - name: Install Tailscale repository prerequisites
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        update_cache: true

    - name: Install Tailscale APT key
      ansible.builtin.get_url:
        url: "{{ tailscale_apt_key_url }}"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"
      register: tailscale_apt_key

    - name: Add Tailscale APT repository
      ansible.builtin.get_url:
        url: "{{ tailscale_apt_repository_url }}"
        dest: /etc/apt/sources.list.d/tailscale.list
        owner: root
        group: root
        mode: "0644"
      register: tailscale_apt_repository

    - name: Update APT cache for Tailscale repository
      ansible.builtin.apt:
        update_cache: true
      when: tailscale_apt_key.changed or tailscale_apt_repository.changed

    - name: Install Tailscale package
      ansible.builtin.apt:
        name: tailscale
        state: present

    - name: Enable Tailscale service
      ansible.builtin.service:
        name: tailscaled
        state: started
        enabled: true

    # Mount the storage partition before creating shares on it.
    - name: Mount storage partition
      ansible.posix.mount:
        path: "{{ storage_mount_path }}"
        src: "UUID={{ storage_partition_uuid }}"
        fstype: "{{ storage_partition_fstype }}"
        opts: defaults
        state: mounted

    # Ensure every share directory exists on the mounted storage partition.
    - name: Create share directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "0777"
      loop: "{{ samba_shares + nfs_exports }}"

    # Install Samba and the Linux NFS server packages before configuring services.
    - name: Install file sharing packages
      ansible.builtin.package:
        name:
          - samba
          - nfs-kernel-server
        state: present

    # Configure Samba from scratch for guest-writable SMB shares.
    - name: Configure Samba share
      ansible.builtin.copy:
        dest: /etc/samba/smb.conf
        content: |
          [global]
             server role = standalone server
             map to guest = Bad User
             usershare allow guests = yes
             load printers = no
             printing = bsd
             printcap name = /dev/null
             disable spoolss = yes

          {% for share in samba_shares %}
          [{{ share.name }}]
             path = {{ share.path }}
             browseable = yes
             read only = no
             guest ok = yes
             guest only = yes
             force user = nobody
             force group = nogroup
             create mask = 0666
             directory mask = 0777

          {% endfor %}
        owner: root
        group: root
        mode: "0644"
        validate: testparm -s %s
      notify: Restart Samba services

    # Ensure the NFS export include directory exists before writing drop-ins.
    - name: Create NFS exports directory
      ansible.builtin.file:
        path: /etc/exports.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # Write managed NFS exports for the NAS shares.
    - name: Configure NFS exports
      ansible.builtin.copy:
        dest: /etc/exports.d/nas.exports
        content: |
          {% for export in nfs_exports %}
          {{ export.path }} {{ export.clients }}({{ export.options }})
          {% endfor %}
        owner: root
        group: root
        mode: "0644"
      notify: Reload NFS exports

    # Enable and start Samba services for SMB/CIFS clients.
    - name: Enable Samba services
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - smbd
        - nmbd

    # Enable and start the NFS server service.
    - name: Enable NFS server service
      ansible.builtin.service:
        name: nfs-kernel-server
        state: started
        enabled: true

  handlers:
    # Reload SSH after sshd_config changes.
    - name: Reload SSH service
      ansible.builtin.service:
        name: "{{ sshd_service_name }}"
        state: reloaded

    # Restart Samba services after smb.conf changes.
    - name: Restart Samba services
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop:
        - smbd
        - nmbd

    # Refresh kernel export table after export configuration changes.
    - name: Reload NFS exports
      ansible.builtin.command: exportfs -ra
      changed_when: true

