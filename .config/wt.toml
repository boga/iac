# Worktrunk project config.
# Python virtual environments contain absolute paths, so each worktree must
# build its own .venv instead of copying one from another worktree.

[[pre-start]]
venv = """
printf 'Trust mise.toml and install Python dependencies? [y/N] '
read -r confirm
case "$confirm" in
  [yY]|[yY][eE][sS])
    mise trust mise.toml && mise install && mise run ansible-python-deps
    ;;
  *)
    echo 'Skipped mise trust; aborting venv setup.'
    exit 1
    ;;
esac
"""

[step.copy-ignored]
exclude = [".venv/"]
