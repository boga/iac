# Worktrunk project config.
# Python virtual environments contain absolute paths, so each worktree must
# build its own .venv instead of copying one from another worktree.

[[pre-start]]
trust-mise = "mise trust mise.toml"

[[pre-start]]
trust-terraform-mise = "mise trust terraform/mise.toml"

[[pre-start]]
install-mise-tools = "mise install"

[[pre-start]]
create-venv = "[ -x .venv/bin/python ] || (rm -rf .venv && mise exec -- python -m venv .venv)"

[[pre-start]]
install-python-deps = "mise run ansible-python-deps"

[step.copy-ignored]
exclude = [".venv/"]
