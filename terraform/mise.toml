[tools]
terraform = "latest"

[tasks."tf:init"]
description = "Initialize Terraform with the S3 backend"
run = '''
op run --env-file=.env.secret -- sh -c 'terraform -chdir=src init \
  -backend-config="bucket=${TF_BACKEND_S3_BUCKET}" \
  -backend-config="region=${AWS_REGION}" \
  -backend-config="endpoints={s3=\"${TF_BACKEND_S3_ENDPOINT}\"}"'
'''

[tasks."tf:plan"]
description = "Plan Terraform changes"
run = "op run --env-file=.env.secret -- terraform -chdir=src plan"

[tasks."tf:apply"]
description = "Apply Terraform changes"
run = "op run --env-file=.env.secret -- terraform -chdir=src apply"

[tasks."tf:destroy"]
description = "Destroy Terraform changes"
run = "op run --env-file=.env.secret -- terraform -chdir=src destroy"

[tasks."tf:fmt"]
description = "Format Terraform files"
run = "terraform -chdir=src fmt -recursive"
